scientific_content_assessment: >-
  Round 9's own diagnosis of the round-8 fixes ("a correction applied in one
  place, leaving an untouched sibling field or an unbuilt guard standing")
  continues to describe round 9's fixes as well, but with an important
  addition this round surfaces: the pattern now also affects the fix
  apparatus's own bookkeeping, not only the protocol's prose claims. R9-F1
  and R9-F5, the two findings whose fixes touched code paths that get
  exercised on every validation run (the estimator/unit agreement and the
  frozen_inputs digest), are both genuinely and fully resolved — the common
  factor across both is that their regression tests assert the *relationship
  between fields* (unit agrees with estimand; an endpoint edit changes the
  digest) rather than a fact about a single field in isolation. R9-F2, R9-F3,
  and R9-F4, whose fixes instead added a new field, a new hedge clause, or a
  new but narrowly-scoped check, each left a sibling requirement from the
  same fix text unaddressed, and this round's R10-F1 shows the same thing can
  happen inside the ledger's own record-keeping when a fix touches more than
  one digest and only some of the changes get logged. A structural
  observation for future rounds: findings whose fix requires touching two or
  more related fields/records in one commit are the ones that keep
  half-landing; a "did every digest/field this commit touched get accounted
  for in the fix's own bookkeeping" check, run against `git show` for the
  landing commit itself before the review closes, would likely have caught
  R10-F1 without a reviewer needing to re-derive it from the diff by hand.

required_before_g4:
  - Resolve R10-F1: add calibration.contract_sha256 to a ledger record's additional_digest_changes (a new record, since the ledger is append-only) before calibration is ever frozen.
  - Resolve R10-F2: make check_git_sha_fields resolve digest_scope and compare against the historical value at that specific path, not a raw-text substring search; extend the test to use a real-but-wrong-scope digest, not only a fabricated one.
  - Resolve R10-F3: state the planted fraction for synthetic_mixed_host_virus and declare mixture_basis's allowed values.
  - Resolve R10-F4: extend the illustrative-numbers hedge to cover the first (argument-bearing) occurrence of the 63-strata figure in minimum_samples_rationale, or remove the count-dependent auxiliary claims from that argument.
  - Resolve R10-F5: extend test_the_sample_floor_is_a_formula_not_an_unbacked_number to also assert factors["viral_abundance"] has no frozen levels.
  - Consider R10-F6 (minor) opportunistically; none is blocking.
  - Run round 11 against the corrected protocol and record its digest and Git SHA.
  - Neither partitions nor calibration may be frozen regardless, pending VAL-01 and REF-08 factor levels; calibration additionally may not be frozen until R10-F1 is resolved, or validate_amendment_ledger will reject the freeze.

verdict_summary: >-
  Does-not-pass. No blocker: R9-F1's blocker is confirmed fully resolved, and
  its resolution direction (correcting the estimator, not the unit) is
  independently re-derived here as scientifically correct given D17's
  per-virus row scoping. Four major readiness defects remain, none of them
  blocking VAL-01's generator/scorer build directly except R10-F3: R10-F1,
  a ledger chain-completeness gap in the very commit that fixed R9-F4,
  which will silently break calibration's freeze the moment that section is
  frozen; R10-F2, R9-F4 reopened — the before-digest check still does not
  verify the digest against its declared digest_scope, so a real digest
  borrowed from the wrong section passes; R10-F3, R9-F2 reopened — the
  mixed-host-virus dataset still has no stated planted fraction or
  mixture_basis vocabulary, the one remaining item an engineer could not
  resolve without asking the author; and R10-F4, an internal contradiction
  in minimum_samples_rationale predating round 6, where the same illustrative
  63-strata figure is stated as fact in one sentence and flagged as
  conditional two sentences later. VAL-01's generator and scorer could
  almost be built from this document today — R10-F3 is the single gap that
  would still require asking the author a question — but the protocol as a
  whole, including its own amendment ledger, is not yet ready for G4.
