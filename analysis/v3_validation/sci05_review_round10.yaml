r9_f1_reasoning_check: >-
  Explicitly re-derived rather than taken on trust, per this round's brief.
  D17_lod_detection_probability's numerator ("biological replicate-virus rows
  detected at the frozen tier") and denominator ("every planned valid
  biological replicate-virus row at each abundance level for that virus
  within a chemistry") both index rows by (biological replicate, virus,
  abundance level, chemistry) — the unit of data collection is already
  virus-specific before any fit is run. synthetic_factorial plants six
  distinct viral targets (EBV, HHV-6A, HHV-6B, HSV-1, HSV-2, KSHV; confirmed
  via `expected_targets`) across the same abundance grid within each
  chemistry. A probit fit pooled across virus within a chemistry (the
  original pre-round-9 estimator text) would treat rows from six viruses with
  potentially different detection sensitivities as replicates of one shared
  detection curve, which is not a valid model of the design and would report
  a single LOD95 number that is not the limit of detection for any of the six
  viruses specifically. Fitting per virus within chemistry is therefore the
  statistically correct choice given how D17 already scopes its rows, not an
  arbitrary preference. The round-9 reviewer's implied fix (delete "virus"
  from E8.unit, keep the estimator pooled per chemistry) would have been
  the wrong direction: it would have papered over the contradiction by
  discarding the more defensible half of it. The author's fix — move the
  estimator, not the unit — is correct, and R9-F1 is CONFIRMED FIXED with no
  shortfall found: unit, estimand, denominator, population, and estimator now
  agree, verified independently across four fields rather than pairwise, and
  `test_the_lod_is_estimated_per_virus_within_chemistry` is mutation-confirmed
  (worktree at 168b0e2) to fail without the fix. This does add one binding
  consequence the fix text itself names and the protocol text now states: if
  VAL-01's generator does not plant every one of the six expected targets at
  every abundance level within every chemistry, the corresponding per-virus
  fit becomes unidentifiable, and the estimator's own text requires reporting
  it as not-estimated rather than silently pooling across the missing cells.

sweep_b_requirement_to_source_table: >-
