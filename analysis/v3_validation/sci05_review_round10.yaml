headline: >-
  The blocker is genuinely closed: R9-F1's fix moved the estimator instead of
  the unit, which is the scientifically correct direction (D17's numerator and
  denominator count biological replicate-virus rows across six planted
  targets, so a pooled chemistry-only fit would average detection curves that
  differ by virus and report a limit belonging to none of them), and unit,
  estimand, denominator, population, and estimator now agree exactly across
  four separate fields with a test that mutation-testing confirms is a real
  guard. R9-F5's fix is also genuinely load-bearing, not cosmetic: endpoints
  and hypotheses are now hashed as full document content inside
  `frozen_inputs_sha256`, confirmed by reading the function rather than
  trusting its docstring, and a direct edit to E8.unit is caught end-to-end by
  `validate_protocol`. But R9-F2, R9-F3, and R9-F4 each repeat the exact
  failure mode round 8 diagnosed and round 9 diagnosed again: the finding's
  headline symptom is fixed while a requirement stated in the same fix text,
  one clause away, is left undelivered. R9-F2's fix declares a dataset and a
  structural planting rule but never states what fraction of anything is
  planted mixed or what `mixture_basis` records, both explicitly requested by
  R9-F2's own fix text. R9-F4's fix adds a before-digest check but the check
  never reads `digest_scope` — it verifies only that the claimed digest
  appears somewhere in the base commit's raw file text, so a real digest
  borrowed from the wrong section (not a fabricated one — the only case the
  new test exercises) still passes silently, which this round reproduced by
  mutation. And the ledger record DEV-016 itself, built to fix R9-F4,
  introduces a fresh instance of the same class: it changed
  `calibration.contract_sha256` (confirmed by diff) but its own
  `additional_digest_changes` block declares only `partitions` and
  `frozen_inputs`, omitting `calibration` entirely — silently breaking the
  calibration section's ledger chain, currently invisible only because
  calibration is not yet frozen, and provably triggering the exact
  "undocumented amendment" error the ledger apparatus exists to prevent the
  moment calibration is frozen, which is a required step before G4.
  Separately, `minimum_samples_rationale` — the same paragraph R8-F3 and R9-F3
  both edited — uses its own "63 strata" illustrative figure unhedged, as
  established fact, in the argument for why the minimum per-stratum sample
  count is four rather than two, two sentences before the paragraph
  explicitly flags that same figure as conditional and illustrative; this
  predates round 8 (traced to round 6) and neither round 8's nor round 9's
  edits to the same paragraph touched it.

findings:
  - id: R10-F1
    reviewer: R11
    severity: major
    section: analysis/v3_validation/deviations.yaml DEV-016.additional_digest_changes vs analysis/v3_validation/protocol.yaml calibration.contract_sha256
    problem: >-
      DEV-016's fix changed `calibration.contract_sha256` from
      `97dc4bc40d1a2b0c90d99f5cdb28c7845268726105947e15de92f73b3862f1b6` to
      `a0f9f1a99eb34ea4c229836a03b6a073c41fb664c7c51847559f3c916c4ebc37`
      (confirmed by diff: the estimator text inside `calibration` changed to
      state "one fit per virus and chemistry" for R9-F1). DEV-016's own
      `additional_digest_changes` block records this kind of side-effect
      digest change for two sections — `partitions.contract_sha256` and
      `frozen_inputs.contract_sha256` — but not for `calibration`, even
      though calibration's digest changed in the identical commit for the
      identical reason. This is a plain omission, not an edge case:
      calibration's base value (97dc4bc...) is literally present in the
      DEV-016 base commit (168b0e2, confirmed via `git show
      168b0e2:analysis/v3_validation/protocol.yaml | grep contract_sha256`),
      exactly the shape every other `additional_digest_changes` entry has.
    reproduced: >-
      `git show 8feefbd -- analysis/v3_validation/protocol.yaml` shows
      calibration's `contract_sha256` line changing from `97dc4bc4...` to
      `a0f9f1a9...` in the same diff hunk as the estimator text edit for
      R9-F1. `git show 8feefbd -- analysis/v3_validation/deviations.yaml`
      shows DEV-016's `additional_digest_changes` containing only
      `partitions.contract_sha256` and `frozen_inputs.contract_sha256` keys —
      no `calibration.contract_sha256` key anywhere in the record. Computed
      directly against the committed functions: setting
      `document['calibration']['status'] = 'frozen'` (simulating the
      near-term, required-before-G4 event of calibration actually being
      frozen) and calling `validate_amendment_ledger(document, ledger)`
      returns `"frozen section 'calibration' digest does not match the
      latest ledger record; undocumented amendment"`, because
      `_ledger_chain_for_section(ledger, "calibration")` still ends at
      DEV-005's recorded after-value (`97dc4bc4...`), never reaching the
      current `a0f9f1a99e...` DEV-016 actually produced.
    scenario: >-
      REF-08 and VAL-01 resolve, calibration's levels freeze, and someone
      flips `calibration.status` to `frozen` as the protocol's own machinery
      requires. `validate_amendment_ledger` — the exact function this
      protocol relies on to detect undocumented amendments — immediately
      fails with "undocumented amendment" against a calibration section that
      was, in fact, fully documented in DEV-016's `description` and `reason`
      prose. Someone now has to figure out, under time pressure at the
      freeze gate, that the actual defect is a missing ledger bookkeeping
      entry from three rounds earlier, and append yet another corrective
      record to patch it — the same "prose says one thing, the check says
      another, and nobody can tell which is authoritative without spelunking"
      failure this round's R10-F2 and R9-F4 before it were both about, this
      time in the ledger's own self-consistency rather than in the protocol
      text it verifies.
    fix: >-
      Add a `calibration.contract_sha256` entry to DEV-016's
      `additional_digest_changes`, with `before: 97dc4bc4...` and `after:
      a0f9f1a9...`, matching the shape of the `partitions` and
      `frozen_inputs` entries already present. Since the ledger is
      append-only, this cannot edit DEV-016 in place; add a new deviation
      record (or extend `field_corrections`' schema to support declaring a
      missing chain entry on an existing record, the way it already supports
      correcting a wrong scalar field) that supplies the missing chain link
      before calibration is ever frozen. Consider a test that walks every
      committed ledger record and asserts every `contract_sha256` that
      actually changed between a record's `git_sha` and its landing commit is
      declared somewhere in that record's `digest_scope` or
      `additional_digest_changes` — this would have caught DEV-016's own gap
      mechanically rather than by a reviewer diffing the commit by hand.

  - id: R10-F2
    reviewer: R11
    severity: major
    section: scripts/check_ledger_append_only.py:check_git_sha_fields vs R9-F4's fix text (reopened)
    problem: >-
      R9-F4's fix text asked for `digest_scope` to be resolved to its named
      field path and the historical value at that path compared against
      `protocol_sha256_before`, or "short of that, at minimum comparing the
      literal recorded value at digest_scope's path in the historical
      revision against protocol_sha256_before." The delivered check does
      neither: it tests `before not in shown.stdout`, a substring search over
      the *entire raw file text* of the base commit, with no reference to
      `digest_scope` at all. `grep -n "digest_scope"
      scripts/check_ledger_append_only.py` still returns zero matches — the
      same fact R9-F4 itself reported about the pre-fix code. This passes the
      one test built for it (a wholly fabricated 64-`a` string, which cannot
      appear in any real file), but a real digest borrowed from the *wrong*
      section of the same base commit — the more realistic error R9-F4's own
      fix text worried about ("copied from the wrong section's digest") —
      still passes with zero errors, because that string genuinely does
      appear somewhere in the file, just under a different field.
    reproduced: >-
      Computed directly against the committed function:
      `python3 -c "import yaml; from copy import deepcopy; from
      scripts.check_ledger_append_only import check_git_sha_fields;
      ledger=yaml.safe_load(open('analysis/v3_validation/deviations.yaml'));
      t=deepcopy(ledger); r=[x for x in t['deviations'] if
      x['deviation_id']=='DEV-013'][0];
      r['protocol_sha256_before']='97dc4bc40d1a2b0c90d99f5cdb28c7845268726105947e15de92f73b3862f1b6';
      print(check_git_sha_fields(t))"` -> `[]` (zero errors), even though
      DEV-013's `digest_scope` is `harmonization.contract_sha256` and the
      substituted value `97dc4bc4...` is calibration's contract digest at
      that same base commit (`5cad263`), not harmonization's — a value with
      no legitimate claim to being DEV-013's before-digest, yet accepted
      because it is present in the file text.
    scenario: >-
      A future deviation record's `protocol_sha256_before` is copy-pasted
      from a sibling section's digest rather than its own — exactly the
      error mode R9-F4's fix text named — and `check_git_sha_fields` reports
      no error, because the wrong-but-real digest still appears somewhere in
      the base commit's file. The ledger and the check both look green while
      the record's claim about what the protocol looked like before the
      amendment, scoped to the section the record actually amends, is wrong.
      This is the same class of error DEV-012's and DEV-013's original
      git_sha mistakes were (R6-F4, R7-F1) — found by a reviewer reasoning
      semantically, not by any mechanical check — and after two rounds of
      "fix the before-digest check," the check still cannot do that specific
      reasoning.
    fix: >-
      As R9-F4 originally specified: resolve `digest_scope` to its field
      path (e.g. `calibration.contract_sha256`), parse the base commit's
      `protocol.yaml` as YAML (not as raw text), extract the value at that
      exact path, and assert it equals `protocol_sha256_before`. This is a
      small change from the current substring approach — the historical file
      is already being fetched via `git show`; it only needs to be parsed
      with `yaml.safe_load` and indexed by the dotted path in `digest_scope`
      instead of searched as a string. Extend
      `test_a_fabricated_before_digest_is_detected` (or add a sibling test)
      to use a real-but-wrong-scope digest as the tampered value, not only a
      wholly fabricated one, so the test actually exercises the case this
      finding reproduces.

  - id: R10-F3
    reviewer: R11
    severity: major
    section: datasets.synthetic_mixed_host_virus.planting_rule vs R9-F2's fix text (reopened)
    problem: >-
      R9-F2's fix text asked for three things: a dataset to own the manifest,
      a planting rule stating "what fraction of samples/cells carry mixed
      molecules," and a declared vocabulary for `mixture_basis`. The
      delivered fix supplies the dataset and a planting rule describing what
      makes a molecule genuinely ambiguous (shared corrected barcode/UMI
      between a host- and virus-derived fragment) — but states no fraction of
      anything, and `mixture_basis` still has no declared vocabulary
      anywhere. `grep -n -i "mixture_basis\|fraction"
      analysis/v3_validation/protocol.yaml` finds `mixture_basis` only as a
      required-column name (line 473) and no planting-rate language anywhere
      in the document.
    reproduced: >-
      `python3 -c "import yaml; p=yaml.safe_load(open('analysis/v3_validation/protocol.yaml'));
      d=[x for x in p['datasets'] if x['id']=='synthetic_mixed_host_virus'][0];
      print(d['planting_rule'])"` prints the "corrected cell-barcode and UMI
      key shared by a host-derived and a virus-derived fragment ... The
      truth class records which of the two the molecule actually came from"
      text — no percentage, rate, or per-condition/per-cell fraction appears
      anywhere in it. `grep -n -i "mixture_basis"
      analysis/v3_validation/protocol.yaml` returns only line 473 (the column
      name in `required_columns`); no enum or allowed-values list exists for
      it, unlike `truth_class`, which can at least plausibly borrow
      `molecule_truth_projection.truth_classes: [unique, ambiguous,
      unresolved]` from elsewhere in the document even though that borrowing
      is itself never stated. The new regression test,
      `test_the_mixed_host_virus_truth_has_a_dataset_and_a_planting_rule`
      (tests/test_validation_protocol.py:1660-1666), asserts only that the
      dataset exists, `truth_status == "exact"`, and a specific substring
      appears in `planting_rule` — it never checks for a fraction or for
      `mixture_basis`, so it cannot catch this.
    scenario: >-
      VAL-01's implementer now knows the dataset, the manifest schema, and
      what makes a planted molecule count as "genuinely ambiguous," but still
      has to invent what fraction of conditions, cells, or molecules within
      `synthetic_mixed_host_virus` actually carry this planted ambiguity —
      1 percent, 10 percent, and 50 percent are all consistent with the
      current text and produce datasets with very different statistical
      power for D14/E6/H5 — and has to invent the `mixture_basis` column's
      vocabulary independently, exactly the "two implementers, two different
      artifacts" failure R9-F2 (and R8-F2 before it) both named.
    fix: >-
      State the planted fraction (of conditions, cells, or molecules — pick
      one level and state it) for `synthetic_mixed_host_virus`, matching the
      specificity `synthetic_host_homology`'s or `synthetic_factorial`'s
      planting language uses elsewhere in the same `datasets` block. Declare
      `mixture_basis`'s allowed values explicitly, even if by pointing at
      `molecule_truth_projection.truth_classes` if that is in fact the
      intended vocabulary. Extend the regression test to check for both.

  - id: R10-F4
    reviewer: R11
    severity: major
    section: partitions.minimum_samples_rationale (internal contradiction, same paragraph R8-F3 and R9-F3 both edited)
    problem: >-
      The paragraph's first half justifies `minimum_samples_per_stratum: 4`
      using the illustrative 63-strata figure as settled fact: "the global
      cap of ceil of 126 times 0.3 gives 38 places for 63 strata. Forty
      percent of strata would deterministically receive no holdout member at
      all." Only after this argument concludes ("Four is the smallest size
      whose floor allocation is at least one...") does the paragraph add,
      for the first time, "Neither viral_abundance nor host_virus_homology
      has frozen levels yet, so both counts below are illustrative" — and
      even then, the word "below" scopes the hedge to the second occurrence
      of the same 63-strata figure two sentences later ("the figures are 63
      strata, 252 samples, and 76 in holdout"), not to its first,
      argument-bearing occurrence. The same underlying quantity (63 strata,
      derived from the same unfrozen 7-abundance-level x 3-homology-level x
      3-chemistry illustration) is therefore stated as unqualified fact in
      one sentence and explicitly flagged as conditional/illustrative two
      sentences later, within one paragraph. `git log --oneline -S "38
      places" -- analysis/v3_validation/protocol.yaml` traces the unhedged
      first occurrence to round 6 (`b8422ae`); round 8's and round 9's edits
      to this same paragraph (R8-F3, R9-F3) both added hedging only to the
      second occurrence, never touching the first.
    reproduced: >-
      `sed -n '544,563p' analysis/v3_validation/protocol.yaml` shows both
      occurrences of "63 strata" in the same `minimum_samples_rationale`
      block, the first unhedged ("...gives 38 places for 63 strata. Forty
      percent of strata would deterministically receive no holdout member at
      all.") preceding the illustrative-numbers disclaimer, the second
      explicitly hedged ("Those illustrative numbers are conditional...").
      `git log --oneline -S "38 places" -- analysis/v3_validation/protocol.yaml`
      -> single commit `b8422ae` (round 6's fix), confirming the unhedged
      text predates and was never revisited by round 8's or round 9's edits
      to the same field.
    scenario: >-
      A reader checking why `minimum_samples_per_stratum` is 4 and not 2
      reads only the first half of the paragraph — the half that actually
      answers that question — and takes "38 places for 63 strata" and
      "forty percent of strata" as established facts about the design, since
      nothing before that point says otherwise. The core conclusion (4, not
      2) does not actually depend on the specific stratum count — the
      degenerate-quota argument (floor of 0.6 is zero, floor of 0.9 is zero,
      floor of 1.2 is one) holds for any stratum size regardless of stratum
      *count* — but the auxiliary "40 percent of strata" claim does, and
      would be wrong under any other final level-count choice, with no text
      anywhere flagging that this specific sentence, unlike the one two
      sentences later using the identical number, is not settled.
    fix: >-
      Extend the "both counts below are illustrative" disclaimer (or add a
      second, earlier one) to cover the first occurrence of the 63-strata
      figure as well, or restate the "two is degenerate" argument using only
      the stratum-size-invariant quota logic (which needs no numeric stratum
      count at all) and drop the "38 places for 63 strata / forty percent"
      language, which is illustrative dressing on an argument that does not
      require it.

  - id: R10-F5
    reviewer: R11
    severity: minor
    section: tests/test_validation_protocol.py:test_the_sample_floor_is_a_formula_not_an_unbacked_number vs R9-F3's fix text
