      `host_virus_homology`, left open for its sibling factor.
    fix: >-
      Add `assert not factors["viral_abundance"].get("levels")` to the
      existing test (or a new one), matching the assertion already present
      for `host_virus_homology`.

  - id: R10-F6
    reviewer: R11
    severity: minor
    section: R9-F6 / R9-F7 / R9-F8 (carried forward, unchanged)
    problem: >-
      Round 9 marked these three minor and non-blocking. Reconfirmed
