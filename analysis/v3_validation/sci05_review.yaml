schema_version: "1.0.0"
protocol_id: viralscan-v3-validation
review_task: SCI-05
review_round: 1
review_date: "2026-07-27"
protocol_sha256: 0a206d2bc774b7ac48c726e3381a1bc2b117dc019bafa03cca8ef9e3c469cf3f
git_sha: 12ab737
verdict: does-not-pass
outcome_eligible: false
outcome_eligible_reason: >-
  No workflow row has executed and no outcome has been inspected. This review is
  pre-outcome, so resolving its findings is not outcome-triggered parameter drift.

reviewers:
  - id: R1
    identity: independent reviewer agent, general-purpose, cold read
    scope: partitions, calibration, and the factors/endpoints/seeds they reference
    verdict: does-not-pass
  - id: R2
    identity: independent reviewer agent, general-purpose, cold read
    scope: >-
      workflow_matrix, failure_and_deviation_reporting, benchmark fairness, and
      the deviation ledger
    verdict: does-not-pass

summary: >-
  Both reviewers rejected the SCI-03 and SCI-04 freezes. The central defect is
  the same in both scopes and is an author error: sections were marked frozen
  while the inputs they depend on are still pending. partitions and calibration
  reference stratification and abundance factors whose levels are empty lists
  awaiting VAL-01, so the split strata cannot be computed and the probit LOD is
  not identifiable. Separately, the benchmark as enumerated cannot produce a
  single ground-truth accuracy number for Venus, Viral-Track, or VIRTUS, because
  the only exact-truth dataset was omitted from all three, while two generic
  baselines were given it. Two enforcement rails are also inoperative: the
  deviation ledger is never read by the validator, and the unpinned-environment
  execution block is reachable only from pytest.

findings:
  - id: F1
    reviewer: R1
    severity: blocker
    section: partitions.status, partitions.stratification_factors
    problem: >-
      partitions is frozen and claims reproducibility from the protocol alone,
      but four of its five stratification factors (viral_abundance,
      infected_cell_fraction, host_virus_homology, sibling_virus_similarity) are
      status pending with levels an empty list, gated on VAL-01 and REF-08. The
      stratum cross-product that defines the split cannot be computed today.
    scenario: >-
      Two correct implementations facing empty level lists diverge, one
      collapsing to a single stratum per chemistry and another erroring. The
      validator only checks that factor names are declared, so this passes CI.
    resolution: deferred
    resolution_note: >-
      Cannot be resolved until VAL-01 and REF-08 freeze the factor levels. A dormant validator rule now refuses a partitions freeze unless every stratification factor is frozen with non-empty levels, so the defect cannot recur by discipline alone.
    proposed_fix: >-
      Do not mark partitions frozen until every stratification factor it
      references is itself frozen with concrete levels.

  - id: F2
    reviewer: R1
    severity: blocker
    section: calibration.limit_of_detection
    problem: >-
      A per-chemistry probit fit on viral_abundance is frozen while
      factors.viral_abundance has zero declared levels. Identifiability cannot
      even be assessed, let alone a non-extrapolated LOD95.
    scenario: >-
      With fewer than roughly four to five abundance levels spanning sub-LOD to
      saturating detection, the fit is degenerate or the LOD95 is only reachable
      by the extrapolation the section prohibits.
    resolution: deferred
    resolution_note: >-
      Same VAL-01 dependency. A dormant rule now requires viral_abundance frozen with at least five levels before calibration may freeze; five is the conservative end of the reviewer range.
    proposed_fix: >-
      Freeze the LOD method only after viral_abundance levels are frozen and
      shown sufficient.

  - id: F3
    reviewer: R1
    severity: blocker
    section: calibration.threshold_search
    problem: >-
      No behaviour is specified when no grid point satisfies the zero-false-call
      constraint. Widening the grid is prohibited and no fallback exists, so the
      procedure has an undefined branch on a plausible input.
    scenario: >-
      synthetic_host_homology is adversarial by construction. If all 45 grid
      points are ineligible, an implementer either relaxes the constraint or
      invents a rule, both of which break the precommitment.
    resolution: resolved
    resolution_note: >-
      threshold_search.no_eligible_grid_point_policy declares calibration failed, forbids relaxing the constraint or widening the grid, and makes any change an outcome-triggered amendment.
    proposed_fix: >-
      State that an empty eligible set means calibration failed, H2 is not
      supportable at any tier, the constraint may never be relaxed post hoc, and
      any change requires an amendment with a deviation record.

  - id: F4
    reviewer: R1
    severity: blocker
    section: calibration.uncertainty
    problem: >-
      A 2000-replicate BCa bootstrap over whole samples is specified with no
      small-n fallback, but hhv6b_srr20710641, ebv_srr12682296,
      hsv1_srr8315713, and pbmc_10x_healthy_v3 are each a single biological
      sample and kshv_ebv_gse154900 is two.
    scenario: >-
      Resampling with replacement from n equals one always returns the same
      sample and yields a zero-width interval, which reads as perfect precision
      rather than not estimable. BCa additionally needs a jackknife acceleration
      term that is undefined at n equals one.
    resolution: resolved
    resolution_note: >-
      uncertainty.minimum_samples_for_interval is 3, with below_minimum_policy reporting the point estimate and marking the interval not-estimable.
    proposed_fix: >-
      Add an explicit minimum sample count below which the point estimate is
      reported and uncertainty is marked not estimable.

  - id: F5
    reviewer: R2
    severity: blocker
    section: workflow_matrix.workflows W7, W8, W9
    problem: >-
      synthetic_factorial is the only dataset with truth_status exact and is the
      sole source for molecule and cell precision, recall, AUPRC, sibling
      confusion, host-virus allocation, and LOD. It is absent from Venus,
      Viral-Track, and VIRTUS while present for ViralScan, STARsolo, and
      traditional subtraction. No row in the matrix can ever produce a
      ground-truth accuracy comparison against the three purpose-built viral
      comparators.
    scenario: >-
      A cross-tool accuracy table shows real F1 and AUPRC for ViralScan and the
      generic baselines beside not-estimable for the three specialist tools,
      reading as a ViralScan win over tools that were never measured.
    resolution: resolved
    resolution_note: >-
      synthetic_factorial added to all three dedicated comparators, in both reference arms.
    proposed_fix: >-
      Add synthetic_factorial or an equivalent exact-truth condition to W7, W8,
      and W9, or add an acceptance rule on the affected endpoints forbidding any
      comparative accuracy statement involving them.

  - id: F6
    reviewer: R2
    severity: blocker
    section: workflow_matrix.workflows W1
    problem: >-
      Six of W1's twelve rows (pbmc_10x_healthy_v3, reagent_control,
      empty_droplet_control, kshv_gse190558, kshv_ebv_gse154900,
      anellovirus_orthogonal_positive) appear in no other workflow, and three of
      those have a null locator and may never exist.
    scenario: >-
      A breadth claim of twelve datasets against five or six for comparators is
      half uncontested and partly placeholder, with no rule requiring that to be
      disclosed alongside the claim.
    resolution: resolved
    resolution_note: >-
      workflow_matrix.breadth_disclosure_rule requires uncontested-row and null-locator counts wherever a breadth claim appears.
    proposed_fix: >-
      Require any breadth claim to state how many of a workflow's rows have zero
      comparator overlap and how many reference datasets that do not yet exist.

  - id: F7
    reviewer: R2
    severity: blocker
    section: failure_and_deviation_reporting.amendment_rule
    problem: >-
      The validator never opens deviations.yaml. Each contract_sha256 check only
      verifies that a section hashes to its own claimed digest, never that the
      digest changed or that a deviation record exists.
    scenario: >-
      An edit that quietly drops a comparator or adds a ViralScan-favourable row
      and recomputes contract_sha256 to match its own new content passes
      validation with zero errors and an untouched ledger.
    resolution: resolved
    resolution_note: >-
      validate_amendment_ledger enforces chain continuity and current-digest agreement for every frozen section; DEV-000 supplies the harmonization genesis baseline. Verified by a negative control and exercised for real by DEV-005.
    proposed_fix: >-
      Add a validator check that each frozen section's digest either matches the
      last committed revision or is recorded as a protocol_sha256_after in
      deviations.yaml.

  - id: F8
    reviewer: R2
    severity: blocker
    section: workflow_matrix.environment_pinning
    problem: >-
      The rule that an unpinned row may not execute is implemented only for
      phase training and holdout, and no CI job, Snakemake rule, or wrapper
      anywhere in the repo invokes those phases. The rail is reachable only from
      pytest.
    scenario: >-
      An outcome-generating run proceeds against an unpinned comparator
      environment with no gate firing, producing results whose tool version is
      unrecoverable.
    resolution: resolved
    resolution_note: >-
      require_execution_allowed exists and is declared with its two required call sites; execution_gate_unimplemented records that no SCI-04 executor exists to attach it to. The review's proposed CI job was declined as it would be permanently red by design.
    proposed_fix: >-
      Add a CI job and a pre-execution precondition that runs the validator at
      phase training, and at phase holdout before any holdout run, failing
      closed before any row executes.

  - id: F9
    reviewer: R1
    severity: major
    section: calibration.metrics M2_negative_false_call_rate
    problem: >-
      The denominator is all negative-condition samples including failed rows,
      which contradicts the not-estimable-and-row-failed convention its mapped
      denominators declare. Crashed rows land in the no-false-call bucket.
    scenario: >-
      A comparator that crashes on most negative conditions reports a better
      false-call rate than one that completes and makes a single error, so
      failures improve apparent specificity.
    resolution: resolved
    resolution_note: >-
      M2 denominates over complete, comparable rows only; failures go to the technical-noncompletion denominator.
    proposed_fix: >-
      Compute M2 only over complete, comparable rows and route failures to the
      technical-failure denominator.

  - id: F10
    reviewer: R1
    severity: major
    section: calibration.metrics M7_two_step_loss
    problem: >-
      The denominator is the combined workflow's own measured molecule count,
      while the endpoint it summarizes denominates against truth-eligible
      planted molecules.
    scenario: >-
      If the combined workflow misses molecules, the denominator shrinks with
      the numerator and a two-step workflow that loses exactly what combined
      also missed reports near-zero loss.
    resolution: resolved
    resolution_note: >-
      M7 denominates against truth-eligible fragments and molecules.
    proposed_fix: Denominate M7 against truth-eligible fragments and molecules.

  - id: F11
    reviewer: R1
    severity: major
    section: partitions.algorithm
    problem: >-
      Ceiling-only per-stratum rounding is a biased-high estimator of the 0.3
      target. A stratum of two yields 50 percent, four yields 50 percent, five
      yields 40 percent.
    scenario: >-
      With a five-factor cross-product producing small strata, the realized
      holdout fraction systematically overshoots the nominal value, shrinking
      the training set the calibration depends on.
    resolution: resolved
    resolution_note: >-
      partitions.algorithm uses global largest-remainder apportionment capped at the ceiling of the total.
    proposed_fix: >-
      Use global largest-remainder apportionment capped at the ceiling of N
      times 0.3 rather than independent per-stratum ceilings.

  - id: F12
    reviewer: R1
    severity: major
    section: partitions.algorithm
    problem: >-
      Sort samples by identifier does not pin collation, case sensitivity, or
      numeric versus lexicographic ordering, unlike the barcode section which
      pins a canonical alphabet regex.
    scenario: >-
      sample_2 and sample_10 order differently under ASCII and natural sort, so
      two implementations select the same holdout count but different members.
      The divergence is silent and undetectable.
    resolution: resolved
    resolution_note: >-
      partitions.sort_key pins byte-wise ASCII, case sensitive, no locale collation.
    proposed_fix: Pin the exact sort key, for example byte-wise ASCII, case sensitive, no locale.

  - id: F13
    reviewer: R1
    severity: major
    section: calibration.tie_breaker
    problem: >-
      Within one standard error of the best training F1 names no estimator for
      that standard error, and no cross-validation scheme is specified for the
      threshold search.
    scenario: >-
      Binomial-proportion, bootstrap, and cross-validation standard errors give
      different eligible sets and therefore different frozen thresholds from the
      same protocol text.
    resolution: resolved
    resolution_note: >-
      calibration.tie_breaker_standard_error names the biological-sample bootstrap and explicitly excludes the binomial and cross-validation estimators.
    proposed_fix: >-
      Name the exact procedure, for example the training-only bootstrap already
      defined under uncertainty applied per grid point.

  - id: F14
    reviewer: R2
    severity: major
    section: workflow_matrix.workflows reference_id
    problem: >-
      All comparators are pinned to curated_human_virus, whose assets are
      kallisto-shaped, including a D-list that is meaningless to STARsolo and to
      VIRTUS. That contradicts labelling those runs published-default, since
      VIRTUS ships its own 763-virus panel.
    scenario: >-
      Either the comparators do not run at their published defaults, or the
      identical-viral-sequences rule is violated across rows. The protocol never
      resolves which.
    resolution: resolved
    resolution_note: >-
      Each dedicated comparator runs a native-published and a matched-accession-index arm, via a new profile value and three native reference entries.
    proposed_fix: >-
      State per comparator whether it runs on its native reference with a
      relaxed same-accessions rule, or on a substituted index, and record which
      resolution no_silent_algorithm_patch permits.

  - id: F15
    reviewer: R2
    severity: major
    section: calibration.threshold_search versus workflow_matrix
    problem: >-
      ViralScan's evidence tiers are grid-searched on the training partition
      while every comparator runs untuned published defaults. The asymmetry is
      undisclosed on the endpoints that consume the tuned output.
    scenario: >-
      A better-calibrated claim rests on ViralScan having been fitted to this
      benchmark and comparators not having been.
    resolution: resolved
    resolution_note: >-
      workflow_matrix.comparator_tuning_asymmetry and a matching principal risk disclose that ViralScan tiers are training-calibrated while comparators run untuned; the parity endpoint is noted as exempt.
    note: >-
      The reviewer notes the cross-tool parity endpoint is genuinely neutral,
      because its layer is counts_unique rather than the tuned allocated
      product, so the asymmetry is confined to the tier and cell-recovery
      endpoints.
    proposed_fix: >-
      Disclose the asymmetry in principal_risks and add an acceptance rule on the
      affected endpoints.

  - id: F16
    reviewer: R1
    severity: major
    section: partitions and principal_risks
    problem: >-
      principal_risks still lists shared templates or genomic loci leaking
      between calibration and holdout as open and unmitigated, while the
      sections that would mitigate it are marked frozen.
    resolution: resolved
    resolution_note: >-
      The principal risk now cross-references the mitigating leakage prohibitions and states the residual risk.
    proposed_fix: >-
      Fold the mitigation into leakage_prohibitions or downgrade the section
      status until it is closed.

  - id: F17
    reviewer: R1
    severity: major
    section: harmonization.feature_universe versus partitions.leakage_prohibitions
    problem: >-
      Reference, D-list, and feature-universe construction draws on every
      prespecified comparison row with no restriction to training-eligible data,
      and leakage_prohibitions never mentions reference construction.
    scenario: >-
      If which genes count as quantifiable is informed by holdout inputs,
      information flows from holdout into training indirectly.
    resolution: resolved
    resolution_note: >-
      A leakage prohibition restricts reference, D-list, and feature-universe construction to training-eligible information.
    proposed_fix: >-
      State that reference, D-list, and feature-universe construction is fixed
      from training-eligible information only or before the split is drawn, and
      add it to leakage_prohibitions.

  - id: F18
    reviewer: R1
    severity: major
    section: partitions singleton-stratum rule versus endpoint reporting
    problem: >-
      Singleton strata always go to training, so a factor level realized by one
      sample never appears in holdout, while the positive-recovery hypothesis
      and the molecule and cell recovery endpoints promise reporting over every
      frozen stratum.
    resolution: partially-resolved
    resolution_note: >-
      The text branch is resolved: unsplittable_stratum_reporting scopes per-stratum endpoints to holdout-eligible strata and reports unsplittable strata separately. The minimum-sample-count branch is deferred to VAL-01.
    proposed_fix: >-
      Scope those endpoints to holdout-eligible strata with unsplittable strata
      reported separately, or require a minimum sample count per stratum before
      freezing levels.

  - id: F19
    reviewer: R2
    severity: major
    section: harmonization.row_failure_policy.primary_claim_rule
    problem: >-
      The rule requires labelling a success-conditioned subset but not that its
      completion denominator travel with the number wherever it is displayed.
    scenario: >-
      A comparator completing one of five rows can be shown with a footnote a
      reader skips, while the number itself reads as representative.
    resolution: resolved
    resolution_note: >-
      harmonization.row_failure_policy.completion_denominator_display_rule requires the completion count in the same cell, element, or sentence as the value. Recorded as DEV-005.
    proposed_fix: >-
      Require every reported per-tool metric to carry its completion count in
      the same table cell or figure element whenever it is below the full planned
      row count.

  - id: F20
    reviewer: R1
    severity: minor
    section: calibration.metrics M9_cross_tool_parity
    problem: >-
      A signed relative difference denominated solely on the comparator count is
      asymmetric and undefined at zero or near-zero comparator counts, which is
      plausible near the LOD and on negatives.
    resolution: resolved
    resolution_note: >-
      M9 is symmetric about the mean of the two counts and reports not-applicable when both are zero.
    proposed_fix: >-
      Use a symmetric measure or document the zero-denominator handling and the
      intentional asymmetry.

  - id: F21
    reviewer: R1
    severity: minor
    section: calibration.metrics M8_tier_calibration_error
    problem: >-
      The denominator is calls assigned to that tier, which is inherently blind
      to failed and uncalled rows, but it is not labelled a success-conditioned
      subset as the failure policy requires elsewhere.
    resolution: resolved
    resolution_note: >-
      M8 is explicitly labelled a success-conditioned subset and cross-referenced to the noncompletion denominator.
    proposed_fix: Add the success-conditioned label and cross-reference the failure denominators.

  - id: F22
    reviewer: R1
    severity: minor
    section: partitions.holdout_fraction versus datasets
    problem: >-
      Only the three synthetic datasets carry a training-and-holdout role, and
      several others are exactly one biological sample for which a 0.3 split is
      undefined, but the exemption is only inferable from analysis_role.
    resolution: resolved
    resolution_note: >-
      partitions.applies_to_dataset_roles limits the split to training-and-holdout datasets, with the exemption rationale stated.
    proposed_fix: >-
      State explicitly in partitions which dataset classes the split applies to
      and which are exempt.

  - id: F23
    reviewer: R1
    severity: minor
    section: calibration.uncertainty.stratified_by
    problem: >-
      Stratifying by viral_abundance is a blanket rule, but that factor is a
      synthetic planted quantity that observational and public datasets do not
      carry.
    resolution: resolved
    resolution_note: >-
      uncertainty.stratification_scope limits abundance stratification to datasets that carry the factor.
    proposed_fix: Scope abundance stratification to datasets that carry the factor.

  - id: F24
    reviewer: R2
    severity: minor
    section: failure_and_deviation_reporting.deviation_record.required_fields
    problem: >-
      protocol_sha256_before and protocol_sha256_after are named as whole-protocol
      hashes but hold a single section digest, disambiguated only by digest_scope,
      which is not in required_fields. The tool_environments blocker text was also
      not updated when VIRTUS was added.
    resolution: resolved
    resolution_note: >-
      digest_scope is a required deviation field, and a validator rule ties the tool_environments blocker text to the comparator tool set, replacing an unenforceable process instruction.
    proposed_fix: >-
      Add digest_scope to required_fields and update the blocker text whenever a
      workflow is added.

not_found:
  - reviewer: R2
    category: cell universe and cross-tool layer neutrality
    note: >-
      Confirmed genuinely tool-neutral by construction. Per-tool called cells,
      unions, and intersections are explicitly invalid primary sources, and the
      validator cross-checks the cross-tool layer against supported scope.
  - reviewer: R2
    category: excluded workflow and unavailable dataset handling
    note: >-
      The kallisto two-step exclusion removes a weaker ViralScan mode rather than
      a comparator, and the unavailable controls carry explicit exclusion rules
      forbidding silent deletion.
  - reviewer: R2
    category: DEV-001 outcome_triggered claim
    note: >-
      Credible. Nothing could have executed, since training execution is not
      allowed and five blockers remain open.

required_before_g3:
  - Resolve or explicitly defer every blocker and major finding above.
  - Downgrade any section whose dependencies are still pending.
  - Re-run an independent review round 2 against the corrected protocol.
  - Record the round-2 protocol SHA-256 and Git SHA here before any outcome run.
