      DEV-014's git_sha correction from git history rather than accepting
      either DEV-013's or DEV-014's own account; (e) spot-checked the
      integrity layer only, per the round's explicit instruction not to
      re-litigate its disclosed ceiling.
    verdict: does-not-pass
    method_note: >-
      `PYTHONPATH=src python3 scripts/validate_v3_protocol.py` and
      `PYTHONPATH=src python -m pytest tests/test_validation_protocol.py -q`
      both pass against the current committed state (133 passed, up from 128
