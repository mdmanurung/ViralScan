      `git worktree add --detach <tmp> 6a8daee`, copied the current
      tests/test_validation_protocol.py into that worktree, and ran the five
      new tests against the round-6 (pre-round-7-fix) protocol/schema/
      validator. Three failed as expected
      (test_the_truth_manifests_have_column_contracts,
      test_sibling_pairs_are_declared_for_the_sibling_metrics,
      test_the_stratum_floor_cannot_be_lowered_to_a_degenerate_value) —
