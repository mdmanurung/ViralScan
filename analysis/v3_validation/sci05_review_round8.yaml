scientific_content_assessment: >-
  Round 7's fix is real where it says it is real: three column contracts, one
  sibling pairing, one schema floor with a genuine algebraic guard, and one
  independently-reproducible git_sha correction. The mutation-test check this
  round ran (rather than trusting "869 passed, 48 deselected") confirms three
  of the five new tests are live regression guards that fail without their
  fix; the other two correctly pin content round 6 had already fixed. What
  this round adds is not a failure of round 7's stated scope — it is evidence
  that the scope itself was incomplete in the same way six of the last seven
  rounds' fixes have been incomplete: a correction applied in one place,
  leaving an untouched sibling field or an unbuilt guard standing.
  E8_limit_of_detection.unit is the sharpest instance, because it is
  literally the same contradiction R6-F2 already fixed once (D17 vs. the
  estimator text) recurring in a second, never-checked field from the
  original genesis commit — seven rounds of review never happened to open
  the endpoints section next to calibration.limit_of_detection.estimator at
  the same time. The mixed-host-virus-truth gap (R8-F2) and the
  homology-level arithmetic gap (R8-F3) are both genuinely new: nobody before
  this round asked "does H5's truth population have a manifest" or
  "does the 63-strata arithmetic's own inputs exist yet," because both
  questions require reading a build-readiness lens across sections that don't
  cite each other.

required_before_g4:
  - Resolve R8-F1: rewrite E8_limit_of_detection.unit to match calibration.limit_of_detection.estimator's per-chemistry-only scope, and add a regression test tying the two together (as R6-F2's fix did for D17).
  - Resolve R8-F2: declare a dataset, manifest asset, and required_columns for the mixed-host-virus-molecule truth population H5/D14/E6 depend on.
  - Resolve R8-F3: either caveat the 63/252/76 figures as conditional on REF-08 yielding 3 homology levels, or defer them until REF-08 resolves host_virus_homology.levels.
  - Resolve R8-F4: pin a cells-per-sample and reads-per-sample (or depth) figure or rule, and a replicate count, before VAL-01 is implemented.
  - Resolve R8-F5: build the git_sha-resolves-to-protocol_sha256_before validator check requested by R6-F4's fix and R7-F1's fix, neither of which delivered it.
  - Consider R8-F6, R8-F7, R8-F8 (minor) opportunistically; none is blocking.
  - Run round 9 against the corrected protocol and record its digest and Git SHA.
  - Neither partitions nor calibration may be frozen regardless, pending VAL-01 and REF-08 factor levels.

verdict_summary: >-
  Does-not-pass. One blocker (R8-F1: E8_limit_of_detection.unit contradicts
  calibration.limit_of_detection.estimator's per-chemistry-only scope, the
  same defect class R6-F2 already fixed once in a sibling field). Multiple
  major readiness defects exist independent of that blocker (R8-F2: no
  truth source for the mixed-host-virus population H5/D14/E6 require; R8-F3:
  the stratum-floor arithmetic depends on an unfrozen homology-level count;
  R8-F4: no cells/reads/replicate specification anywhere; R8-F5: the
  git_sha-resolution validator check requested twice before is still
  missing). VAL-01 implementation should not begin from this protocol text
  as-is.
