reviewers:
  - id: R9
    identity: independent reviewer agent, general-purpose, cold read, round 8
    scope: >-
      Per this round's brief: (a) role-played the implementer who must build
      VAL-01 from protocol.yaml alone and catalogued every quantity or
      behaviour that document does not pin, checking specifically the seven
      non-chemistry factors, the abundance-grid "near-zero/near-saturating"
