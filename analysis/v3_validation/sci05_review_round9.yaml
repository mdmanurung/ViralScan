scientific_content_assessment: >-
  Round 8's diagnosis of its own finding class was correct — it explicitly
  named the pattern ("a correction applied in one place, leaving an
  untouched sibling field or an unbuilt guard standing") — but the fixes it
  then wrote did not apply that diagnosis to themselves. Each of R8-F1
  through R8-F3 and R8-F5 corrected exactly the symptom named in the
  finding's title while leaving an adjacent, structurally identical instance
  of the same claim uncorrected: virus alongside homology in the same unit
  string, viral_abundance alongside host_virus_homology in the same
  sentence, protocol_sha256_before-verification alongside git_sha-resolution
  in the same requested check, dataset-and-planting-rule alongside
  column-contract in the same fix requirement. This is not evidence of
  carelessness so much as evidence that "fix the finding as stated" and "fix
  the claim the finding is about" are different tasks, and seven rounds
  running have defaulted to the former. R9-F5 (endpoints/hypotheses
  uncovered by any digest) is the one genuinely new structural finding this
  round adds rather than reopening: it is offered as a partial explanation
  for why this pattern concentrates specifically in endpoints/D-series
  content rather than elsewhere in the document — the sections with digest
  coverage (harmonization, partitions, calibration, workflow_matrix) have
  not, in fact, exhibited this pattern in the fields their digests actually
  cover.

