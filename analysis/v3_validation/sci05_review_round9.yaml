headline: >-
  Round 8's fixes are real but every one of them is a partial fix of the same
  kind round 8 itself flagged: a finding's headline symptom is corrected while
  a sibling instance of the identical claim, sitting one field away, is left
  standing. E8_limit_of_detection.unit was rewritten from
  "virus-chemistry-homology-stratum" to "virus-chemistry-stratum" — homology
  removed, but "virus" was never questioned, even though the field it sits
  next to in the same endpoint block, E8.estimand, says "estimated per
  chemistry" (no virus), and calibration.limit_of_detection.estimator says
  "one fit per chemistry and no further stratification." This is the third
  round this exact contradiction has been found in this exact field family
  (R6-F2 on D17, R8-F1 on E8, now on E8 again), and this time the two
  disagreeing fields are inside the same ten-line endpoint block — the
  shortest possible distance a reviewer would have to look. R8-F2's mixed
  host-virus manifest fix delivered a column list but not a dataset to own it
  or a planting rule to say what fraction of anything is mixed — an
  implementer has the schema of a table with no generator plan to populate
  it. R8-F3's fix caveated exactly one of the two unfrozen inputs feeding the
  same arithmetic sentence: "seven abundance levels" sits three words before
  "three homology levels" in minimum_samples_rationale, and only the second
  was flagged as pending. R8-F5's fix built a check, but the check verifies a
  narrower claim than the one requested three times running (R6-F4, R7-F1,
  R8-F5's own fix text): it never reads `digest_scope`, never computes a
  section digest, and never checks `protocol_sha256_before` against anything
  — a fabricated before-digest with a correct git_sha passes silently, which
  this round reproduced by direct mutation. Underlying all four: `endpoints:`
  and `hypotheses:` — the two sections that define what this protocol is
  actually testing, and the sections R6-F2 and R8-F1 both found broken
  content in — carry no `contract_sha256` of their own and are absent from
  `frozen_inputs.covers`, so nothing in the digest apparatus would even
  theoretically notice a change to them. That is not a new symptom; it is the
  mechanism that explains why the same field keeps breaking three rounds
  running without anything flagging it.

findings:
  - id: R9-F1
    reviewer: R10
    severity: blocker
    section: endpoints.E8_limit_of_detection.unit vs endpoints.E8_limit_of_detection.estimand vs calibration.limit_of_detection.estimator
    problem: >-
      R8-F1's fix changed E8.unit from "virus-chemistry-homology-stratum" to
      "virus-chemistry-stratum," removing "homology" but leaving "virus." The
      claim "the LOD estimate is reported at this granularity" now disagrees
      within the *same ten-line endpoint block*: E8.unit says
      "virus-chemistry-stratum" (line 923) while E8.estimand, the very next
      field, says "Viral abundance at the frozen detection probability under
      the frozen tier rule, estimated per chemistry with homology recorded
      per row rather than fitted separately" (line 924) — "per chemistry,"
      no virus dimension. calibration.limit_of_detection.estimator agrees
      with estimand, not unit: "Probit regression of per-sample detection on
      log10 planted viral abundance, fitted on the training partition across
      the frozen abundance factor levels, with one fit per chemistry and no
      further stratification" (line 760) — "no further stratification" rules
      out a virus dimension exactly as it rules out the homology dimension
      R8-F1 already removed. Nothing in the estimator ever names virus as a
      covariate or a stratifying factor; the only per-virus content anywhere
      near this endpoint is D17's numerator/denominator, which correctly
      describe individual *input rows* as per-virus (biological
      replicate-virus rows feeding one pooled chemistry-level fit), not the
      *reported estimate's* granularity.
    reproduced: >-
      `grep -n "unit: virus-chemistry-stratum" analysis/v3_validation/protocol.yaml`
      -> line 923. `sed -n '921,926p'` shows unit and estimand as adjacent
      fields of the same `id: E8_limit_of_detection` block. `grep -n "one fit
      per chemistry and no further stratification"
      analysis/v3_validation/protocol.yaml` -> line 760. DEV-015's own
      description (analysis/v3_validation/deviations.yaml lines 512-513)
      states the fix as "Corrected E8's unit, which still declared a
      per-homology stratum the limit-of-detection estimator disclaims" — it
      names only the homology defect, confirming the fix's own record never
      considered the virus dimension. The regression test added for R8-F1,
      `test_the_lod_unit_matches_its_estimator`
      (tests/test_validation_protocol.py:1583-1587), asserts
      `unit == "virus-chemistry-stratum"` and `"homology" not in unit` —
      it pins the still-wrong string as correct and never checks unit
      against estimand or against the estimator's "no further
      stratification" text, so it cannot catch this. Mutation-tested: this
      test passes both before and after this review's finding, because it
      was written to assert the buggy value.
    scenario: >-
      An implementer reads E8.unit first (it is the field literally named
      "unit," the natural place to look up reporting granularity) and builds
      6 viruses x 3 chemistries = 18 separate LOD95 estimates. Reading
      E8.estimand or calibration.limit_of_detection.estimator next reveals
      the fit pools across virus within a chemistry, so the 18 numbers an
      implementer following unit alone would report are either fabricated
      (no separate fit was ever run to produce them) or duplicated (the same
      3 chemistry-level LOD95 values relabeled 6 times each under a virus
      identity the fit never used). Either a report author cites E8.unit to
      justify per-virus LOD95 claims the design cannot support, or the
      contradiction is caught only when someone happens to read both fields
      at once — exactly what did not happen for two prior rounds on this
      same field pairing.
    fix: >-
      Rewrite E8_limit_of_detection.unit to "chemistry-stratum," matching
      estimand and the estimator exactly. Strengthen
      test_the_lod_unit_matches_its_estimator (or add a new test) to assert
      unit and estimand agree on stratification granularity programmatically
      — e.g. that neither "virus" nor "homology" appears in unit — rather
      than asserting a specific string that could again be half-corrected.
      Given this is the third round in this exact field pairing, also
      consider a general test that scans every endpoint's `unit` field for
      any token absent from that endpoint's own `estimand`/`reporting` text.

  - id: R9-F2
    reviewer: R10
    severity: major
    section: harmonization.audit_artifacts (mixed_host_virus_manifest.tsv) vs datasets vs hypotheses.H5 / harmonization.denominators.D14 / endpoints.E6
    problem: >-
      R8-F2's fix text required three things: "declare a dataset (or extend
      an existing one) carrying mixed host-virus molecules, add a manifest
      asset ... with a required_columns contract ..., and state the planting
      rule (what fraction of samples/cells carry mixed molecules, how the
      truth host/viral allocation is recorded per molecule)." Only the
      middle item landed. `mixed_host_virus_manifest.tsv` now has a column
      list, but no entry under `datasets:` references it (the manifest's own
      `dataset_id` column has no declared domain — which of the twelve
      dataset ids may legitimately appear there is unstated), and no text
      anywhere states what fraction of conditions, samples, cells, or
      molecules are planted as mixed, or how the truth host/viral mass split
      is computed and recorded. The `mixture_basis` column also has no
      declared vocabulary, unlike `truth_class`, which can plausibly borrow
      `molecule_truth_projection.truth_classes: [unique, ambiguous,
      unresolved]` from context even though that borrowing is itself never
      stated explicitly.
    reproduced: >-
      `grep -n "mixed_host_virus_manifest\|synthetic_mixed"
      analysis/v3_validation/protocol.yaml` returns exactly one line (472,
      the audit_artifacts path/columns entry) — no match under `datasets:`
      (checked by listing every dataset's `assets` block:
      `python3 -c "import yaml; ... [d['assets'] for d in
      p['datasets']]"` shows twelve datasets, none listing a mixed-host-virus
      asset). `grep -n -i "mixture_basis\|planting rule\|fraction.*mixed\|mixed.*fraction"
      analysis/v3_validation/protocol.yaml` finds `mixture_basis` only as a
      column name (line 473) and no planting-rate text anywhere.
    scenario: >-
      VAL-01 now has a target schema for mixed_host_virus_manifest.tsv but no
      generator plan to fill it: which dataset(s) it belongs to (a new one,
      or an extension of synthetic_factorial or synthetic_host_homology —
      each choice changes what "mixed" means relative to that dataset's
      existing truth columns), what fraction of molecules/cells/samples
      carry mixed truth, and what `mixture_basis` records are all
      unreviewed implementer choices, exactly the failure mode R8-F2
      originally described ("a second implementer given the same text could
      reasonably build a different one"). H5, a safety-class hypothesis, is
      still at risk of being permanently not-estimable if the generator team
      does not independently decide to plant any mixed molecules at all,
      because nothing requires it to.
    fix: >-
      Add a `dataset_id` (new dataset, e.g. `synthetic_mixed_host_virus`, or
      an explicit `mixed_host_virus_manifest` asset entry under an existing
      dataset such as `synthetic_factorial`) that owns the manifest. State
      the planting rule: the fraction of conditions/cells/molecules carrying
      mixed truth, and the rule for computing/recording the truth host/viral
      mass split per molecule. Declare `mixture_basis`'s allowed values.

  - id: R9-F3
    reviewer: R10
    severity: major
    section: partitions.minimum_samples_rationale vs factors.viral_abundance
    problem: >-
      R8-F3's fix rewrote the sample-floor arithmetic as a formula and
      correctly flagged that `host_virus_homology.levels` is still empty
      pending REF-08, so the "63 strata / 252 samples / 76 holdout" figures
      are illustrative. The same sentence also uses "seven abundance
      levels" as a fixed input to the identical arithmetic ("At seven
      abundance levels and three chemistries that is 84 times the number of
      host-homology levels") without flagging it, but
      `factors.viral_abundance.levels` is *also* `[]`, status `pending`,
      resolution_task VAL-01 — the same unfrozen state as
      host_virus_homology, just resolved by a different task. The text
      claims "the stratum count is the product of the frozen level counts of
      the three stratification factors" (viral_abundance,
      host_virus_homology, chemistry), but only chemistry (3 levels) is
      actually frozen; two of the three factors that arithmetic depends on
      are pending. "Seven" is sourced from
      calibration.limit_of_detection.abundance_grid_requirement's "At least
      seven distinct planted abundance levels per chemistry" — an explicit
      floor ("at least"), not a frozen exact count, so VAL-01 remains free to
      choose 8, 10, or more levels for reasons entirely internal to the LOD
      grid design (bracketing the detection knee), independent of this
      section's sample-floor arithmetic.
    reproduced: >-
      `python3 -c "import yaml; p=yaml.safe_load(open('analysis/v3_validation/protocol.yaml'));
      f={x['id']:x for x in p['factors']}; print(f['viral_abundance'])"` ->
      `{'id': 'viral_abundance', ..., 'status': 'pending', 'levels': [],
      'resolution_task': 'VAL-01', ...}` — identical unfrozen shape to
      host_virus_homology. `sed -n '544,563p' analysis/v3_validation/protocol.yaml`
      shows "At seven abundance levels..." (line 555) and "Those illustrative
      numbers are conditional: factors.host_virus_homology.levels is still
      empty pending REF-08" (lines 558-559) — the conditional clause names
      only one of the two pending factors the sentence's own arithmetic uses.
      The regression test added for R8-F3,
      `test_the_sample_floor_is_a_formula_not_an_unbacked_number`
      (tests/test_validation_protocol.py:1590-1598), asserts only that
      `factors["host_virus_homology"]` has no levels and that "conditional"
      and "the formula, not the illustration" appear in the rationale text —
      it never checks viral_abundance's status, so it cannot catch this.
    scenario: >-
      A reader takes "seven abundance levels" as an already-settled design
      parameter (the sentence's own grammar presents it as fact, unlike the
      homology count, which the same sentence explicitly hedges with "if
      REF-08 freezes"). If VAL-01, following
      abundance_grid_requirement's actual floor language, selects nine or ten
      abundance levels instead of seven (a legitimate choice under "at
      least seven" if the detection knee needs more resolution), the
      "84 times the number of host-homology levels" formula's own worked
      multiplier is wrong, and nobody following minimum_samples_rationale
      literally would know to recompute it, because the text told them only
      one of its two open inputs was still open.
    fix: >-
      Extend the conditional clause to cover both unfrozen inputs: state
      that the illustrative multiplier "seven" is itself only the floor from
      abundance_grid_requirement and that the true stratum count also
      depends on VAL-01's actual choice of abundance-level count once
      finalized. Extend test_the_sample_floor_is_a_formula_not_an_unbacked_value
      (or add a new test) to also assert `factors["viral_abundance"]` has no
      frozen levels yet, so a future round that freezes viral_abundance
      without updating this text is caught the same way freezing
      host_virus_homology alone would not silently validate the illustration.

  - id: R9-F4
    reviewer: R10
    severity: major
    section: scripts/check_ledger_append_only.py:check_git_sha_fields vs the fix text of R6-F4, R7-F1, and R8-F5
    problem: >-
      R6-F4's fix text, R7-F1's fix text, and R8-F5's own fix text all
      requested the same mechanism, worded most precisely in R8-F5's fix:
      "for each ledger record, resolve git_sha with `git show <sha> --
      analysis/v3_validation/protocol.yaml`, compute the section digest per
      digest_scope, and assert the recorded protocol_sha256_before appears
      as that revision's section digest." The function delivered by DEV-015
      does something narrower: it resolves git_sha, and then checks only
      whether the record's `protocol_sha256_after` string literally appears
      as a substring inside that revision's raw protocol.yaml text — flagging
      the record only if it does (meaning git_sha is provably the landing
      commit or later). It never reads `digest_scope` at all, never computes
      any digest of the base commit's actual section content, and never
      checks `protocol_sha256_before` against anything. A record whose
      `git_sha` correctly resolves to a genuine pre-landing ancestor commit,
      but whose `protocol_sha256_before` is simply wrong (typo,
      copy-pasted from the wrong section, fabricated), passes this check
      with zero errors, which is exactly the class of error R6-F4 originally
      raised the concern about (a recorded digest "taken on trust" per
      frozen_inputs.limitation, never independently verified).
    reproduced: >-
      Computed directly against the committed function:
      `python3 -c "import yaml; from copy import deepcopy; from
      scripts.check_ledger_append_only import check_git_sha_fields;
      ledger=yaml.safe_load(open('analysis/v3_validation/deviations.yaml'));
      t=deepcopy(ledger); r=[x for x in t['deviations'] if
      x['deviation_id']=='DEV-005'][0];
      r['protocol_sha256_before']='deadbeef'*8; print(check_git_sha_fields(t))"`
      -> `[]` (zero errors) despite the before-digest being an obviously
      fabricated 64-hex-character value unrelated to any real content, with
      git_sha (87fbca5) and protocol_sha256_after left untouched and valid.
      `grep -n "digest_scope" scripts/check_ledger_append_only.py
      scripts/validate_v3_protocol.py` returns zero matches in either file
      — `digest_scope` is a ledger field that no script reads. Source
      inspection of `check_git_sha_fields`
      (scripts/check_ledger_append_only.py:109-155) confirms the only
      comparison performed is `if after in shown.stdout`.
    scenario: >-
      A future deviation record's protocol_sha256_before is wrong for any
      reason other than "git_sha names the landing commit instead of the
      base" — e.g. it is copied from the wrong section's digest, or from a
      different deviation record entirely — and `check_git_sha_fields`
      reports no error, so the ledger and the check both look green while
      the recorded chain of "what the protocol looked like before this
      amendment" is silently wrong. This is not a hypothetical: DEV-012 and
      DEV-013's git_sha errors (the ones R6-F4 and R7-F1 caught) were found
      by a reviewer reasoning about the record's *semantic* correctness, not
      by any mechanical digest comparison, and the delivered check still
      cannot do that reasoning.
    fix: >-
      Build what was actually requested: resolve `digest_scope` to the named
      field path (e.g. `harmonization.contract_sha256`), load the base
      commit's protocol.yaml via `git show <git_sha>:...`, extract that same
      field's value at that revision, and assert it equals
      `protocol_sha256_before`. This requires deciding how each
      `contract_sha256` is computed from section content (currently
      undefined anywhere in the repository — these values are hand-maintained
      per frozen_inputs.limitation's own disclosure) or, short of that,
      at minimum comparing the literal recorded value at digest_scope's path
      in the historical revision against protocol_sha256_before, which the
      current implementation does not do at all.

  - id: R9-F5
    reviewer: R10
    severity: major
    section: frozen_inputs.covers / planned_freeze_sections vs endpoints / hypotheses (no contract_sha256 anywhere in either section)
    problem: >-
      Every section this protocol calls frozen carries its own
      `contract_sha256`: harmonization (line 50), partitions (629),
      calibration (814), frozen_inputs itself (1546), workflow_matrix (1924),
      failure_and_deviation_reporting (1971) — six fields total, confirmed
      by `grep -n "contract_sha256:"`. Neither `endpoints:` nor
      `hypotheses:` — both top-level lists, not sub-dicts of harmonization —
      carries one, and neither is named in `frozen_inputs.covers` (which
      lists only seeds, factors, dataset-and-reference-identity, and
      execution-readiness) or in `planned_freeze_sections` (eight entries,
      none named endpoints or hypotheses). This means the two sections that
      state what this protocol is actually testing — the acceptance rules,
      estimands, and falsification rules for H1-H7 and E1-E10 — sit
      completely outside the tamper-evidence apparatus this document
      otherwise relies on. This is not merely the disclosed limitation that
      a digest is "taken on trust" (frozen_inputs.limitation already says
      that): it is that no digest of any kind, trusted or not, exists for
      these two sections at all.
    reproduced: >-
      `grep -n "^endpoints:\|^hypotheses:" analysis/v3_validation/protocol.yaml`
      -> lines 816 and 868, both directly under the document root with no
      enclosing dict, confirmed by `python3 -c "import yaml; p=yaml.safe_load(...);
      print(type(p['endpoints']), type(p['hypotheses']))"` -> both `<class
      'list'>`. `grep -n "contract_sha256:" analysis/v3_validation/protocol.yaml`
      returns exactly six lines (50, 629, 814, 1546, 1924, 1971); none is
      inside or adjacent to either list. `grep -n "covers:" -A5
      analysis/v3_validation/protocol.yaml` shows frozen_inputs.covers is
      `[seeds, factors, dataset-and-reference-identity, execution-readiness]`.
      This is a structural fact, not an inference: every DEV record that has
      ever amended E8, D17, or any other endpoint/denominator content
      (DEV-013, DEV-014, DEV-015) has had to attribute its digest_scope to a
      *different* section (harmonization, via D-series denominators living
      there) rather than to endpoints itself, because endpoints has no
      digest of its own to name — confirmed by inspecting DEV-015's own
      digest_scope: harmonization.contract_sha256, even though its
      description explicitly includes "Corrected E8's unit."
    scenario: >-
      Precisely the recurrence this round documents: E8.unit was wrong at
      genesis (d941261), wrong through six subsequent rounds, half-corrected
      at round 8, and still wrong now — three rounds of review, zero digest
      mismatches, because nothing computes or checks a digest over
      `endpoints:` content in the first place. A future accidental
      reversion of R9-F1's own fix (E8.unit changed back to include "virus"
      or "homology") would trigger no schema failure, no ledger check
      failure, and no `frozen_inputs` violation — only another review round
      noticing by eye, the exact failure mode that has now recurred three
      times on this one field.
    fix: >-
      Add `endpoints` and `hypotheses` to `frozen_inputs.covers` (or give
      each its own `contract_sha256` the way harmonization/partitions/
      calibration/workflow_matrix/failure_and_deviation_reporting already
      have) so that content changes to E1-E10 and H1-H7 are digest-tracked
      the same way every other frozen section is, closing the specific gap
      that let R9-F1 (and R8-F1, and R6-F2 before it) go unnoticed for as
      long as they did.

  - id: R9-F6
    reviewer: R10
    severity: minor
    section: harmonization.audit_artifacts (cell_universe_manifest.tsv columns universe_role, membership) vs cell_universe.empty_droplet_population / D11
    problem: >-
      D11_empty_droplet_false_calls denominates on "every prespecified
      frozen empty-droplet barcode" within "exact synthetic empty-droplet
      evaluation universe," and cell_universe.empty_droplet_population
      states this population is
      "prespecified-empty-droplet-barcodes-reported-separately." The only
      plausible column source for this is cell_universe_manifest.tsv's
      `universe_role`/`membership` columns, but no enum or vocabulary for
      either column is declared anywhere in protocol.yaml or in
      schemas/v3/validation_protocol.schema.json.
    reproduced: >-
      `grep -n "universe_role\|membership" analysis/v3_validation/protocol.yaml
      schemas/v3/validation_protocol.schema.json` shows `universe_role` and
      `membership` only as column names in the audit_artifacts
      required_columns list (protocol.yaml:444) and unrelated substring
      matches ("Partition membership...", "Holdout membership...") in the
      schema; no allowed-values list exists for either column in either
      file.
    scenario: >-
      Two implementations of VAL-01 could reasonably choose different string
      vocabularies for `universe_role`/`membership` (e.g.
      "called_cell"/"empty_droplet" vs "cell"/"empty"), and a
      denominator_audit.tsv consumer written against one vocabulary would
      silently miscount D11 against the other.
    fix: >-
      Declare the allowed values for `universe_role` and `membership` in
      cell_universe.

  - id: R9-F7
    reviewer: R10
    severity: minor
    section: harmonization.denominators.D15/D16 count_layer vs harmonization.count_layers
    problem: >-
      D15_two_step_truth_read_loss and D16_two_step_truth_molecule_loss
      denominate on count_layer values `exact-read-lineage` and
      `exact-read-lineage-molecule-survival`, but harmonization.count_layers
      defines only four named layers (product_primary, cross_tool_primary,
      evidence_tier_input, secondary_ambiguity_aware), each with structured
