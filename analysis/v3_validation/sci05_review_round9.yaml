  - Resolve R9-F2: declare a dataset (or extend an existing one) for mixed_host_virus_manifest.tsv, and state the planting rule and mixture_basis vocabulary.
  - Resolve R9-F3: extend minimum_samples_rationale's conditional caveat to cover viral_abundance.levels, not only host_virus_homology.levels.
  - Resolve R9-F4: build the digest_scope-resolution and protocol_sha256_before verification actually requested by R6-F4, R7-F1, and R8-F5, or explicitly narrow what those fix texts asked for if the weaker check is judged sufficient.
  - Resolve R9-F5: bring endpoints and hypotheses under frozen_inputs.covers or give each section its own contract_sha256.
  - Consider R9-F6, R9-F7, R9-F8 (minor) opportunistically; none is blocking.
  - Run round 10 against the corrected protocol and record its digest and Git SHA.
  - Neither partitions nor calibration may be frozen regardless, pending VAL-01 and REF-08 factor levels.

verdict_summary: >-
  Does-not-pass. One blocker (R9-F1: E8_limit_of_detection.unit still
  contradicts its own adjacent estimand field and
  calibration.limit_of_detection.estimator — the third round this exact
  contradiction has been found in this exact field, and this time the
  disagreeing fields are ten lines apart). Multiple major readiness defects
  exist independent of that blocker (R9-F2: the mixed-host-virus manifest
  round 8 declared still has no owning dataset or planting rule; R9-F3: the
  sample-floor arithmetic's other unfrozen input, viral_abundance, was left
  unhedged while host_virus_homology was fixed; R9-F4: the git_sha check
  built for R8-F5 verifies a narrower claim than the one requested three
  times, and a fabricated protocol_sha256_before passes it silently,
  demonstrated by mutation; R9-F5: endpoints and hypotheses carry no digest
  coverage at all, which is offered as a structural explanation for why this
  round's blocker and R8-F1/R6-F2 before it all landed in exactly that
  section). VAL-01 implementation should not begin from this protocol text
  as-is.
