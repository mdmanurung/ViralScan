  population "exact synthetic truth-labelled shared cell anchors" resolves
  to cell_universe_manifest.tsv + truth_manifest.tsv (declared), but requires
  calibrated evidence tiers from the still-pending calibration section.
  PENDING (tracked, execution_readiness.training_blockers.partitions_metrics).
  ---
  H7_workflow_tradeoff -> E7_two_step_loss (D15, D16) and
