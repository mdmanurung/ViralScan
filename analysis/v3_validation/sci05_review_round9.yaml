priority_2_build_readiness: >-
  Re-run of the "what would VAL-01's implementer still have to invent"
  exercise, after the round-8 fixes, restricted to gaps not already covered
  by a tracked pending-resolution-task factor (those are expected and
  disclosed, not surprises):
  (1) Which dataset mixed_host_virus_manifest.tsv belongs to, what fraction
  of anything is planted mixed, and how truth host/viral mass is split per
  molecule — R9-F2, nothing in the current text answers this.
  (2) Whether E8's LOD estimate is one number per chemistry (as estimand and
  the estimator say) or one number per virus-chemistry pair (as unit says)
  — R9-F1, a direct contradiction with no tie-breaker text anywhere.
  (3) The allowed vocabulary for cell_universe_manifest.tsv's
  universe_role/membership columns — R9-F6.
  (4) What artifact and columns record "exact fragment lineage" for the W2
  STAR-based two-step workflow (D15/D16's count_layer) — R9-F7.
  (5) Level counts and values for the four unconsumed factors
  (low_complexity, pcr_duplication, cb_umi_collisions, ambient_index_hopping)
  — carried forward from R8-F8/R9-F8, still no endpoint or hypothesis to
  size them against.
  Not new build gaps, but worth restating because they remain live and
  because minimum_samples_per_stratum's floor arithmetic (R9-F3) means
  VAL-01 cannot even finalize the abundance-level count purely from
  abundance_grid_requirement's "at least seven" without also knowing whether
