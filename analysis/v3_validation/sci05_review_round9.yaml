sweep_b_requirement_to_source_table: >-
  Full consumer-backwards inventory over every hypothesis, endpoint, and
  denominator, listing what each requires and where it resolves. "OK" means
  every requirement resolves to a declared dataset/asset/column/frozen field.
  "GAP" cites the finding above that covers the shortfall. Entries whose only
  open requirement is a factor level still pending under its own tracked
  resolution_task (VAL-01, REF-08) are marked "PENDING (tracked)" rather than
  GAP, because that pendingness is already disclosed by the factor's own
  status field and by execution_readiness.training_blockers — it is not an
  undeclared source, just an unresolved one.
  ---
  H1_count_integrity -> E1_count_invariants -> D1_count_invariant_runs:
  population "complete run matrix and audit" resolves to
  workflow_failures.tsv (declared, harmonization.audit_artifacts). OK.
  ---
  H2_negative_specificity -> E2_negative_false_calls -> D7/D8/D9/D11:
  D7-D9 population "exact synthetic host-only and planted host-homology
  negatives" resolves to host_only_manifest.tsv + host_homology_manifest.tsv
  (declared). D11 population "exact synthetic empty-droplet evaluation
  universe" resolves only loosely to cell_universe_manifest.tsv's
  universe_role/membership columns, whose vocabulary is undeclared. GAP
  (R9-F6, minor).
  ---
  H3_positive_recovery -> E3_molecule_recovery (D2, D3), E4_cell_recovery
  (D4, D5, D6), E8_limit_of_detection (D17):
  D2/D3 population "frozen shared cells and common target genes" resolves to
  cell_universe_manifest.tsv + feature_universe.tsv + truth_manifest.tsv
  (declared). D4/D5 resolve to cell_universe_manifest.tsv + truth_manifest.tsv
  (declared). D6 additionally requires "one continuous score id frozen in
  SCI-03" -> calibration is status pending, tracked under
  execution_readiness.training_blockers.partitions_metrics. PENDING
  (tracked). D17 population "frozen synthetic LOD grid per chemistry"
  resolves to truth_manifest.tsv (declared) but requires
  factors.viral_abundance.levels, which is pending under VAL-01. PENDING
  (tracked) for the level values themselves; but E8's *unit* field
  (independent of whether abundance levels are frozen yet) contradicts its
  own estimand and the estimator text regardless of level-freezing status.
  GAP (R9-F1, blocker).
  ---
  H4_sibling_discrimination -> E5_sibling_confusion -> D13, D24:
  population "exact synthetic sibling-virus strata" resolves to
  sibling_virus_pairs (declared, round 7) + synthetic_factorial's
  expected_targets + truth_manifest.tsv's sibling_virus_similarity_level
  column (declared). OK.
  ---
  H5_host_conservative -> E1_count_invariants (see H1, OK) and
