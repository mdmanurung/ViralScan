principal_risks:
  - Synthetic truth may not reproduce all real library artefacts.
  - Public positives are contextual and lack complete single-cell infection truth.
  - >-
    Shared templates or genomic loci can leak between calibration and holdout.
    Mitigated by partitions.leakage_prohibitions, which bars sharing of any
    template, locus, molecule, UMI, or cell barcode across partitions and
    restricts reference, D-list, and feature-universe construction to
    training-eligible information. The residual risk is that a shared locus is
    not recognised as shared, which the frozen factor levels must make explicit.
  - Annotation and feature mismatch can dominate apparent comparator differences.
  - Tool failures can create informative censoring if failed rows disappear.
  - Few biological samples will produce wide sample-level uncertainty.
  - Cell-level resampling would create pseudoreplication.
  - A large threshold search can overfit evidence tiers.
  - >-
    ViralScan's tiers are calibrated on the training partition while comparators
    run untuned at published defaults, so tier-dependent endpoints compare a
    fitted tool against unfitted ones. Disclosed by
    workflow_matrix.comparator_tuning_asymmetry; the cross-tool parity endpoint
    is exempt because it uses the untuned counts_unique layer.
  - Runtime comparisons are confounded unless hardware and scheduler conditions match.
  - >-
    Host-virus homology in this panel is almost entirely low-complexity (F-023),
    so host_virus_homology and low_complexity are not separable axes. The
    repeat_homology level, and REF-09, test mostly low-complexity reads, which
    the DEF-01 read-artefact filter already targets. Neither may be reported as
    independent evidence that genuine shared-gene homology is handled, because
    the panel offers almost none to test.
