frozen_inputs:
  status: frozen
  resolution_task: SCI-03
  frozen_at: "2026-07-27"
  covers:
    - seeds
    - factors
    - dataset-and-reference-identity
    - execution-readiness
    - endpoints
    - hypotheses
    - defaults_selection
  rule: >-
    Every seed and factor already marked frozen is covered by one digest, so a
    frozen value cannot be changed without the digest changing and a deviation
    record being required. Seeds and factors are not sections with their own
    status, but they are load-bearing for reproducibility: the split seed
    determines partition membership, and factor levels determine the strata. The
    protocol promises seeds are never selected after outcomes are viewed; this
    digest is what makes that promise checkable rather than asserted.
  recorded_deviations:
    - DEV-000
    - DEV-001
    - DEV-002
    - DEV-003
    - DEV-004
    - DEV-005
    - DEV-006
    - DEV-007
    - DEV-008
    - DEV-009
    - DEV-010
    - DEV-011
    - DEV-012
    - DEV-013
    - DEV-014
    - DEV-015
    - DEV-016
    - DEV-017
    - DEV-018
    - DEV-019
    - DEV-020
    - DEV-021
    - DEV-022
    - DEV-023
    - DEV-024
    - DEV-025
  threat_model: >-
    This scheme is tamper-evident against accidental and partial edits: a digest
    left stale, a ledger record edited without re-chaining, a blocker deleted in
    passing. It is not protective against a motivated author willing to make one
    coherent, self-consistent edit across the protocol, the ledger, and where
    applicable the schema. SCI-05 round 4 reproduced that attack against every
    layer, and it is the fixed point of the design: nothing here is anchored to
    anything outside files the protocol's own author controls, except
    scripts/check_ledger_append_only.py, which compares the ledger against
    committed history and therefore requires rewriting shared history rather than
    editing a file. Read every digest in this protocol as evidence of care, not
    as proof of honesty.
  limitation: >-
    This detects an undocumented change to an already-frozen seed or factor, to
    any dataset or reference identity field including accessions, chemistries,
    source, and asset locators and digests, or to the execution-readiness blocker
    list, and to defaults_selection, which has no section digest of its own
    until it freezes. It does not cover seeds or factors still pending, which may change
    freely until frozen. It does not verify that an asset marked verified
    actually hashes to its recorded value: the recorded digest is still taken on
    trust, so this detects a changed claim, not a false one. It does not cover
    prose fields elsewhere in the protocol whose sections carry their own
    contract digests.
  contract_sha256: 3cc202f114d8650ac6f9e125f9ef9c0e581192a84a2c1b4b03bfd58b08e2a49d

exclusions:
  - id: X1_invalid_input
    scope: whole run or biological sample
    rule: Exclude only checksum mismatch, corrupt/truncated FASTQ, mate desynchronization, unresolved chemistry, reference mismatch, or missing exact truth metadata.
    rationale: These conditions invalidate the prespecified estimand before outcomes are considered.
  - id: X2_unsupported_scope
    scope: claim and workflow
    rule: Do not use nonhuman, bulk, spatial, long-read, single-nucleus-specific, or unpaired assays for production-scope claims.
    rationale: They are outside the v3 production contract.
  - id: X3_legacy_or_private
    scope: result and manuscript
    rule: Exclude all pre-v3 corrected/combined counts and private clinical results lacking ethics and access documentation.
    rationale: Legacy values are scientifically incompatible; private human data require owner-supplied governance.
  - id: X4_unsafe_workflow
    scope: workflow row
    rule: Exclude kallisto two-step host filtering unless exact fragment identity becomes available; retain an explicit unsupported row.
    rationale: CB-UMI-wide removal can delete unrelated fragments and is not a stable v3 workflow.
  - id: X5_no_outcome_exclusion
    scope: all analyses
    rule: Never exclude low performance, ambiguous molecules, candidate false evidence, comparator crashes/timeouts, or unfavourable public samples after outcomes are known.
    rationale: Such exclusions create selection and reporting bias; failures remain planned rows.

workflow_matrix:
  status: pending
  resolution_task: SCI-04
  frozen_at: null
  primary_comparison_rules:
    - Identical FASTQ inputs, verified by SHA-256, for every workflow in a comparison.
    - >-
      Identical viral sequences and the same host genome release across compared
      rows. This rule governs the matched-accession-index arm, which is the arm
      the primary cross-tool comparison is drawn from. Native-published arms
      deliberately violate it, because running a tool on its own bundled
      reference is what makes published-default meaningful.
    - >-
      The outcome-independent cell anchor from the frozen harmonization contract,
      never a per-tool called-cell list or an intersection of tool outputs.
    - >-
      The audited feature intersection from the frozen feature universe, with
      unique-only molecule parity on counts_unique as the cross-tool layer.
    - >-
      Ambiguity-aware outputs are a separate secondary analysis and may never be
      substituted into a primary parity comparison.
  arm_claim_scope: >-
    The matched-accession-index arm carries every primary cross-tool accuracy
    claim, because only there do all compared rows share viral sequences. The
    native-published arm measures each tool as its authors ship it, and its
    numbers are reported separately and always alongside a statement that the
    reference differed. A native-arm number may never be placed in the same
    comparison table as a matched-arm number without that disclosure, and a
    difference between a native and a matched arm of the same tool is attributed
    to the reference rather than to the tool.
  required_row_record_fields:
    - workflow_row_id
    - workflow_id
    - dataset_id
    - reference_id
    - chemistry
    - command
    - command_sha256
    - tool_version
    - container_digest
    - input_sha256
    - reference_sha256
    - row_execution_status
    - endpoint_comparability_status
    - exit_code
    - stderr_path
    - scheduler_accounting
    - output_artifact_sha256
  environment_pinning:
    status: pending
    resolution_task: REL-03
    rule: >-
      Every workflow must carry an exact tool version and container digest before
      any outcome-generating run. The matrix below freezes which rows exist and
      what must be pinned; REL-03 supplies the values. A row whose environment is
      unpinned may not execute.
    execution_gate:
      guard: scripts.validate_v3_protocol.require_execution_allowed
      required_call_sites:
        - manifest_build_time
        - per_row_pre_execution
      status: unimplemented
      note: >-
        No SCI-04 workflow-row executor exists in this repository yet, so the
        guard has nothing to attach to. When one is written it must call the guard
        at both sites. Manifest-build time fails fast and cheaply; per-row
        pre-execution is the airtight rail, because on a scheduler the submission
        and the job start are separated in time and the protocol may change
        between them. The ordinary viralscan CLI must never call this guard: the
        protocol file is not shipped in the installed package, so gating it would
        break every user run. There is no bypass flag.
