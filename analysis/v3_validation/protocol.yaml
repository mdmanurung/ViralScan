      role: comparator
      reference_id: curated_human_virus
      reference_resolution: matched-accession-index
      native_counterpart: W10a_legacy_v2_native
      dataset_ids:
        - synthetic_factorial
        - synthetic_host_only
        - synthetic_host_homology
        - hhv6b_srr20710641
        - ebv_srr12682296
        - hsv1_srr8315713
  predecessor_comparison_layer: >-
    ViralScan 2.2.0's reported product sums a UMI-deduplicated unique-mapping
    term with a read-weighted fractional multimap term, so the product itself is
    not an integer unique-molecule quantity and cannot satisfy the cross-tool
    adapter. The scored layer for both legacy arms is therefore counts_original,
    its UMI-deduplicated unique-mapping term, which is adapter-eligible. This
    must be stated wherever a legacy number appears, because counts_original is
    the kb-python unique-mapping output rather than 2.2.0's distinguishing
    multimap correction: the comparison measures the counting contract the two
    versions share, not the correction that differs. The merged 2.2.0 product is
    declared incomparable at every endpoint under the existing
    missing_equivalent_policy, and is reported descriptively only.
  predecessor_comparable_axes:
    - molecule-precision-recall-f1-on-counts_unique
  predecessor_incomparable_axes_rule: >-
    Cell precision, recall, and F1, negative false-call rate, cell-level sibling
    confusion, host-virus allocation error, and limit of detection are all
    denominated on the evidence-tier layer, which is ViralScan-internal and has
    no comparator adapter. No claim on those axes may be made against ViralScan
    2.2.0 or any other comparator unless an adapter is first declared and frozen
    for it. Reporting them as not-applicable is required; reporting them as a
    comparator failure or as zero is prohibited.
  predecessor_comparison_rule: >-
    ViralScan 2.2.0 is included as a comparator so that any claim that v3
    improves on the original is a measured claim rather than a count ratio. The
    two versions report different units: 2.2.0 emits read and BUS-weighted values
    that can be fractional, v3 emits integer corrected-barcode-UMI molecules. A
    difference in reported magnitude between them is therefore definitional and
    carries no information about which is more correct. Only truth-panel metrics
    may support an improvement claim, and only those denominated on a layer both
    tools can produce. As of SCI-05 round 5 that is exactly one axis: molecule
    precision, recall, and F1 on counts_unique, listed in
    predecessor_comparable_axes. Every other axis once contemplated here, namely
    cell precision, recall, and F1, negative false-call rate, sibling confusion,
    host-virus allocation error, and limit of detection, is denominated on the
    ViralScan-internal evidence-tier layer and is governed by
    predecessor_incomparable_axes_rule, which requires reporting it as
    not-applicable rather than as a comparator result. The comparable axis must be
    reported with its denominator, and an improvement on it may not be reported as
    general superiority.
  accession_linkage_rule: >-
    A matched-accession-index arm must build its index from the same accession set
    that its native counterpart's bundled panel contains. Today every relevant
    viral_panel field is null, on both curated_human_virus and the three native
    panels, so the linkage is declared but not yet checkable: the two arms are
    currently indistinguishable placeholders. When REL-03 pins the container
    digests it must also populate viral_panel on each native reference entry, and
    a validator check must then confirm that the matched index's accession set
    equals its counterpart's. Until that check exists and passes, no claim may
    attribute a native-versus-matched difference to the reference rather than to
    the accession set, because the two are not yet distinguishable.
  excluded_workflows:
    - id: X_kallisto_two_step
      reason: >-
        The kallisto two-step path cannot establish exact fragment lineage, so its
        molecule counts are not comparable at the unique-only parity layer.
      revisit_condition: >-
        Include only if exact fragment lineage becomes available and is audited
        before any outcome is inspected.
  no_silent_algorithm_patch: >-
    Venus, Viral-Track, and VIRTUS run in isolated, digest-pinned environments at
    their published defaults. Any change to a comparator's algorithm, parameters,
    or source is a protocol deviation that must be recorded and disclosed, never
    an undocumented local patch.
  comparator_architecture_note: >-
    The dedicated comparators span three distinct architectures so that a shared
    failure mode cannot be mistaken for a general result. Venus and Viral-Track
    detect viral reads after host handling; VIRTUS3 subtracts host with STAR and
    then quantifies viral transcripts with salmon in a splicing-aware manner
    rather than by genome copy number. VIRTUS overlaps the traditional
    subtraction rows in architecture but not in implementation, so both are
    retained.
  breadth_disclosure_rule: >-
    Any claim about the number of datasets or conditions a tool was evaluated on
    must state, in the same place as the claim, how many of that tool's rows have
    no comparator on the same dataset, and how many reference datasets that do
    not yet exist. ViralScan runs on all twelve datasets while comparators run on
    six, and several of those twelve have a null locator, so an unqualified
    breadth claim reports uncontested and hypothetical coverage as if it were
    measured comparison.
  chemistry_confound_disclosure: >-
    Chemistry is confounded with virus in the public positives: EBV appears only
    under 10x v2, HSV-1 only under Drop-seq, and HHV-6B and KSHV only under
    10x v3. A per-virus difference observed on public data therefore cannot be
    separated from a per-chemistry difference, and any such claim must say so.
    The synthetic panel is not confounded this way, because every condition is
    generated under all three chemistries, so chemistry-separable claims come
    from the synthetic arm alone.
  comparator_tuning_asymmetry: >-
    ViralScan's evidence tiers are selected by a grid search on the training
    partition. Every comparator runs at its published defaults and is never fitted
    to this benchmark. No claim that ViralScan is better calibrated, or better at
    any tier-dependent endpoint, may omit this asymmetry. The cross-tool parity
    endpoint is unaffected, because its layer is counts_unique rather than the
    tuned allocated product.
  expected_row_count: 90
  contract_sha256: c96990c8172a69fbb0a676a98100b2d5bc5f43c4a7eaf800723398960898c4c7

failure_and_deviation_reporting:
  status: pending
  resolution_task: SCI-04
  frozen_at: null
  row_failure_policy_ref: harmonization.row_failure_policy
  required_failure_fields:
    - workflow_row_id
    - attempt_id
    - row_execution_status
    - stage
    - command
    - exit_code
    - stderr_path
    - scientific_parameter_hash
  retry_lineage: >-
    Every attempt is retained with its command, environment, timestamps, exit
    code, and logs. A retry appends a new attempt record and never replaces or
    erases its predecessor. Attempt identifiers are unique within a workflow row.
  deviation_record:
    required_fields:
      - deviation_id
      - date
      - affected_workflow_row_ids
      - protocol_section
      - description
      - reason
      - outcome_triggered
      - protocol_sha256_before
      - protocol_sha256_after
      - digest_scope
      - git_sha
    disclosure_rule: >-
      A deviation prompted by observing an outcome is recorded with
      outcome_triggered true and disclosed as such in every report that depends
      on the affected rows.
  amendment_rule: >-
    Any change to a frozen section after freeze is a protocol amendment requiring
    a new contract digest, a deviation record, and a complete rerun of every
    affected workflow row.
  prohibited:
    - Deleting or omitting a planned row from any denominator.
    - Replacing a failed attempt with a retry rather than appending to it.
    - Imputing an accuracy value for a noncomplete row.
    - Reporting a success-conditioned subset without labelling it as such.
    - Amending a frozen section without a deviation record and a new digest.
  contract_sha256: 38a263c432a19806354823b3d34323d344f4c0e27401a223e7d737344b88a4e5

execution_readiness:
  training_allowed: false
  holdout_allowed: false
  training_blockers:
    - id: partitions_metrics
      description: >-
        Partition, calibration, metric, LOD, and bootstrap design is drafted but
        not frozen. SCI-05 round 1 rejected it: the stratification and abundance
        factors it depends on are still pending with empty level lists, no
        behaviour is specified for an empty eligible threshold grid, the
        tie-breaker standard error is undefined, and the bootstrap has no
        small-sample fallback. See analysis/v3_validation/sci05_review.yaml.
      resolution_task: SCI-03
    - id: workflow_rows
      description: >-
        Workflow rows and the failure contract are drafted but not frozen.
        SCI-05 round 1 rejected them: the only exact-truth dataset is absent from
        Venus, Viral-Track, and VIRTUS, six ViralScan rows have no comparator
        coverage, comparator reference handling contradicts published-default,
        and the deviation-ledger and environment-pinning rails are unenforced.
        See analysis/v3_validation/sci05_review.yaml.
      resolution_task: SCI-04
    - id: accession_linkage_unchecked
      description: >-
        workflow_matrix.accession_linkage_rule requires that a matched-accession-index
        arm build its index from the same accession set as its native counterpart,
        but every relevant viral_panel is null and no validator check exists, so
        the two arms are indistinguishable placeholders. REL-03 must populate
        viral_panel on curated_human_virus and on each native-published reference
        when it pins the container digests, and the cross-check must then be
        implemented, before any native-versus-matched difference may be attributed
        to the reference.
      resolution_task: REL-03
    - id: execution_gate_unimplemented
      description: >-
        No SCI-04 workflow-row executor exists, so the require_execution_allowed
        guard declared in workflow_matrix.environment_pinning.execution_gate is
        not called anywhere. Until an executor exists and calls it at both
        required sites, nothing mechanically prevents a row from running against
        an unpinned environment.
      resolution_task: REL-03
    - id: independent_review_round_2
      description: >-
        SCI-05 round 1 returned does-not-pass from both reviewers. A round-2
        independent review against the corrected protocol is required, with its
        protocol SHA-256 and Git SHA recorded, before any outcome-generating run.
      resolution_task: SCI-05
    - id: independent_review
      description: Independent protocol review and freeze sidecar do not exist.
      resolution_task: SCI-05
    - id: production_reference
      description: Curated reference, GRCh38 D-list, and calibrated host-homology safeguards are pending.
      resolution_task: REF-09
    - id: simulator
      description: Generator, numeric factor levels, stage seeds, and tiny truth gate are pending.
      resolution_task: VAL-09
    - id: data_hashes
      description: KSHV, PBMC, optional controls, and reverified public-positive hashes are incomplete.
      resolution_task: SCI-03
    - id: tool_environments
      description: >-
        Versions and container digests are pending for every comparator tool:
        starsolo, traditional-host-subtraction, venus, viral-track, virtus,
        viralscan-2.2.0.
      resolution_task: REL-03
  holdout_blockers:
    - id: training_gate
      description: The training phase has not completed under the frozen protocol.
      resolution_task: SCI-03
    - id: training_results_digest
      description: A validated training-results manifest and SHA-256 are absent.
      resolution_task: RES-03
    - id: thresholds_digest
      description: Training-derived thresholds.json has not been frozen and hashed.
      resolution_task: RES-03

