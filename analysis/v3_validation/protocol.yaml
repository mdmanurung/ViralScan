exclusions:
  - id: X1_invalid_input
    scope: whole run or biological sample
    rule: Exclude only checksum mismatch, corrupt/truncated FASTQ, mate desynchronization, unresolved chemistry, reference mismatch, or missing exact truth metadata.
    rationale: These conditions invalidate the prespecified estimand before outcomes are considered.
  - id: X2_unsupported_scope
    scope: claim and workflow
    rule: Do not use nonhuman, bulk, spatial, long-read, single-nucleus-specific, or unpaired assays for production-scope claims.
    rationale: They are outside the v3 production contract.
  - id: X3_legacy_or_private
    scope: result and manuscript
    rule: Exclude all pre-v3 corrected/combined counts and private clinical results lacking ethics and access documentation.
    rationale: Legacy values are scientifically incompatible; private human data require owner-supplied governance.
  - id: X4_unsafe_workflow
    scope: workflow row
    rule: Exclude kallisto two-step host filtering unless exact fragment identity becomes available; retain an explicit unsupported row.
    rationale: CB-UMI-wide removal can delete unrelated fragments and is not a stable v3 workflow.
  - id: X5_no_outcome_exclusion
    scope: all analyses
    rule: Never exclude low performance, ambiguous molecules, candidate false evidence, comparator crashes/timeouts, or unfavourable public samples after outcomes are known.
    rationale: Such exclusions create selection and reporting bias; failures remain planned rows.

