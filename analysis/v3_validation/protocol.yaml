    - id: production_reference
      description: Curated reference, GRCh38 D-list, and calibrated host-homology safeguards are pending.
      resolution_task: REF-09
    - id: simulator
      description: Generator, numeric factor levels, stage seeds, and tiny truth gate are pending.
      resolution_task: VAL-09
