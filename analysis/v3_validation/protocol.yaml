factors:
  # DEF-00: every level below is proposed, not frozen. Each factor stays pending
  # until the G3 freeze, after independent review and user sign-off.
  - id: viral_abundance
    description: >-
      Total planted molecules per target virus per sample (DEF-00 B5, D3), the
      quantity MECH-B thresholds; spread over that virus's designated infected
      cells by a multinomial draw. Half-log10 steps bracketing the expected
      detection knee at 3 to 30 summed molecules.
    status: pending
    levels: [1, 3, 10, 30, 100, 300, 1000]
    resolution_task: VAL-01
    pending_reason: Proposed by DEF-00; frozen at G3.
  - id: infected_cell_fraction
    description: >-
      Fraction of a sample's 2,000 cells designated for each virus (DEF-00 B10):
      20, 80, or 300 cells. Six disjoint sets at 0.15 use 1,800 cells, and
      co_infected pairs share theirs. is_infected_cell means the cell received at
      least one planted molecule, so an undetectable designated cell is not a
      recall miss.
    status: pending
    levels: [0.01, 0.04, 0.15]
    resolution_task: VAL-01
    pending_reason: Proposed by DEF-00; frozen at G3.
  - id: host_virus_homology
    description: >-
      Presence of host-derived challenge reads homologous to the panel (DEF-00
      section F). none plants no challenge read; repeat_homology plants reads
      from the 89 REF-07 clusters (70 training, 19 holdout, assigned whole by
      partition). REF-07 found 98.8 percent of the viral bases that align to
      GRCh38 lie in low-complexity sequence, against 4.5 percent of the panel,
      and no cluster with an exonic non-low-complexity 31-mer (F-023), so the
      identity and aligned-length bands first planned have no material. Each
      challenge read records its own low_complexity_fraction, so the confound
      with low_complexity is recorded per read rather than designed away.
      Consequence for REF-09: its test that planted human-homology reads cannot
      reach probable or strong is mostly a test on low-complexity reads, which
      the DEF-01 read-artefact filter already targets, and must be reported as
      such rather than as independent evidence.
    status: pending
    levels: [none, repeat_homology]
    resolution_task: REF-07
    pending_reason: Proposed by DEF-00 from the REF-07 table; frozen at G3.
  - id: sibling_virus_similarity
    description: >-
      Planting regime for each partitions.sibling_virus_pairs pair (DEF-00 B3,
      D2): disjoint_cells plants the members into non-overlapping cell sets,
      co_infected into the same set, one_member_only plants one member chosen by
      a seeded draw per pair. one_member_only falls on exactly one sample per
      stratum and is consumed by D25. Per-pair ANI is measured and recorded, not
      varied.
    status: pending
    levels: [disjoint_cells, co_infected, one_member_only]
    resolution_task: VAL-01
    pending_reason: Proposed by DEF-00; frozen at G3.
  - id: low_complexity
    description: >-
      Fraction of library reads that are low-complexity artefact reads (DEF-00
      B11), drawn from the four measured artefact classes (poly-G, poly-A, CAG
      repeat, TSO join) with tract length at least 40 nt. Viral 3-prime poly-A
      tails are always on and are not this factor; host-derived repeat reads
      belong to host_virus_homology.
    status: pending
    levels: [0, 0.01, 0.05]
    resolution_task: VAL-01
    pending_reason: Proposed by DEF-00; frozen at G3.
  - id: pcr_duplication
    description: >-
      Mean reads per source molecule (DEF-00 B12), drawn as one plus a geometric
      variable with that mean.
    status: pending
    levels: [2, 5, 10]
    resolution_task: VAL-01
    pending_reason: Proposed by DEF-00; frozen at G3.
  - id: cb_umi_collisions
    description: >-
      Fraction of viral molecules given a corrected CB-UMI collision (DEF-00
      B13): half share the same key as another molecule and half sit one
      Hamming step away from it (disjoint).
    status: pending
    levels: [0, 0.005, 0.02]
    resolution_task: VAL-01
    pending_reason: Proposed by DEF-00; frozen at G3.
  - id: ambient_index_hopping
    description: >-
      Fraction of each virus's molecules relocated as contamination (DEF-00
      B14). Ambient molecules move to uninfected cells and empty droplets of the
      same sample; hopped molecules are copied into another sample of the same
      partition and chemistry under that sample's barcode pool.
    status: pending
    levels: [0, 0.01, 0.05]
    resolution_task: VAL-01
    pending_reason: Proposed by DEF-00; frozen at G3.
  - id: chemistry
    description: Supported barcode and UMI geometry.
    status: frozen
    levels: [10xv2, 10xv3, drop-seq]
    resolution_task: SCI-01
    pending_reason: null

