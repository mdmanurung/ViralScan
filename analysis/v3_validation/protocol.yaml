principal_risks:
  - Synthetic truth may not reproduce all real library artefacts.
  - Public positives are contextual and lack complete single-cell infection truth.
  - Shared templates or genomic loci can leak between calibration and holdout.
  - Annotation and feature mismatch can dominate apparent comparator differences.
  - Tool failures can create informative censoring if failed rows disappear.
  - Few biological samples will produce wide sample-level uncertainty.
  - Cell-level resampling would create pseudoreplication.
  - A large threshold search can overfit evidence tiers.
  - Runtime comparisons are confounded unless hardware and scheduler conditions match.
