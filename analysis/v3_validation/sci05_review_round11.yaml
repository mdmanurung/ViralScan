verdict_summary: >-
  Does-not-pass. No blocker: nothing found this round undermines the
  protocol's scientific content, and R9-F1's and R10-F4's resolutions both
  independently reverify as sound. Two major readiness defects, both in
  round 10's own fixes to the amendment-ledger machinery specifically:
  R11-F1, R10-F1 reopened — DEV-017's `field_corrections` entry meant to
  log DEV-016's missed `calibration.contract_sha256` change is never
  consumed by the code that builds a section's digest chain, so simulating
  calibration's freeze today reproduces the identical "undocumented
  amendment" error round 10 reported before the fix landed, and the
  correction's own recorded value is separately truncated from 64 to 12 hex
  characters; and R11-F2, R10-F2 reopened — the scope-aware before-digest
  check now correctly verifies the one shape round 10 demonstrated
  (`digest_scope` present, two segments, section exists) but silently
  passes with zero errors when `digest_scope` is absent, names a section
  absent from the base commit, or names a nested path, none of which
  requires malformed input to reach. Two minor findings: R11-F3, no
  validation that a `field_corrections` entry targets a real record or a
  field any consumer reads, which is structurally how R11-F1's inert
  correction went unnoticed; and R11-F4, the R9-F6/R9-F7 vocabulary gaps
  carried forward unchanged. VAL-01's generator and scorer could be built
  from this document today without asking the author a question — R10-F3's
  fix holds up under independent reverification and no new
  generator/scorer-facing gap was found — but the protocol's own amendment
  ledger, the apparatus G4 depends on, is not ready: it will fail the
  moment calibration is frozen, exactly as it would have before round 10's
  fix commit landed.
