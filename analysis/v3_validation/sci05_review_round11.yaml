buildability_assessment: >-
  Independent judgement, not inherited from round 10. Restricting to what
  VAL-01's generator and scorer specifically would need (as opposed to the
  amendment-ledger tooling, which R11-F1 and R11-F2 concern and which is a
  separate, project-management-facing apparatus from the dataset the
