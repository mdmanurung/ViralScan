      and (b) auditing hypotheses/falsifiability, exclusions, audit_artifacts, and
      freeze/execution_readiness coherence for defects not yet examined.
    verdict: does-not-pass
    method_note: >-
      Every round-5 finding was checked against `git show 5cad263 --
      analysis/v3_validation/protocol.yaml` (the actual fix diff), not against the
      round-5 fix commit message, which in two places (R5-F1, R5-F4) describes a
