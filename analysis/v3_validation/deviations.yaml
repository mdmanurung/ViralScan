schema_version: "1.0.0"
protocol_id: viralscan-v3-validation
description: >-
  Protocol deviation and amendment ledger required by
  failure_and_deviation_reporting. Every change to a frozen section appends a
  record here.
field_semantics: >-
  git_sha is the base commit the amendment was written against, not the commit
  that lands it. The landing commit cannot be known when the record is written,
  and SCI-05 round 6 finding R6-F4 arose from that ambiguity: DEV-012 recorded the
  commit of the review it responded to rather than either. The base commit is
  always knowable at write time, so it is the definition.
integrity: >-
  Records must be appended, never edited or removed. Two mechanisms check that,
  and neither makes it true by construction. Each record's record_sha256 chains
  to its predecessor, so an edit that does not re-chain is detected. And
  scripts/check_ledger_append_only.py compares this file against committed
  history and fails on any modification, deletion, or reordering of an existing
  record. A motivated author who re-chains the file and rewrites the compared
  revision defeats both. The purpose is to make an undocumented amendment cost
  more than a quiet edit, not to make it impossible.

