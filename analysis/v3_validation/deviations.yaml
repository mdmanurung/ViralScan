  - deviation_id: DEV-006
    date: "2026-07-27"
    affected_workflow_row_ids:
      - W7a_venus_native
      - W7b_venus_matched
      - W8a_viral_track_native
      - W8b_viral_track_matched
      - W9a_virtus_native
      - W9b_virtus_matched
    protocol_section: workflow_matrix
    description: >-
      Added synthetic_factorial to all three dedicated comparators and split each
      into a native-published arm and a matched-accession-index arm, giving twelve
      workflows over 78 rows. Declared venus_native_panel,
      viral_track_native_panel, and virtus_native_panel as native-published
      references, a new profile value. Added breadth_disclosure_rule and
      comparator_tuning_asymmetry, a matching principal risk, digest_scope as a
      required deviation field, and refreshed the tool_environments blocker text.
    reason: >-
      SCI-05 round 1 findings F5, F6, F14, F15, and F24. F5 was the most serious:
      synthetic_factorial is the only dataset with exact truth, and excluding the
      three purpose-built comparators from it while including the generic
      baselines made a ground-truth accuracy comparison against them structurally
      impossible. F14 followed from pinning comparators to a kallisto-shaped index
      whose D-list is meaningless to them while labelling those runs
      published-default; two arms separate a tool difference from a reference
      difference.
    outcome_triggered: false
    outcome_triggered_justification: >-
      No workflow row has executed and no outcome has been inspected. Every change
      follows from an independent pre-outcome review, and all of them widen or
      even the comparison rather than narrowing it in ViralScan's favour.
