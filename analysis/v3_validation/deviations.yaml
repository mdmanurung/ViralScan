  - deviation_id: DEV-004
    date: "2026-07-27"
    affected_workflow_row_ids: []
    protocol_section: partitions, calibration
    description: >-
      Resolved the SCI-05 round 1 specification gaps in both SCI-03 sections.
      partitions: replaced per-stratum ceiling rounding with global
      largest-remainder apportionment, pinned the sort key to byte-wise ASCII,
      scoped the split to training-and-holdout datasets, stated unsplittable
      stratum reporting, and added a leakage prohibition covering reference,
      D-list, and feature-universe construction. calibration: added an
      empty-eligible-grid failure policy, named the tie-breaker standard-error
      estimator, corrected the negative-false-call and two-step-loss denominators,
      made cross-tool parity symmetric with defined zero handling, labelled tier
      calibration as success-conditioned, and added a minimum-sample rule and
      stratification scope to the bootstrap.
    reason: >-
      SCI-05 round 1 findings F3, F4, F9, F10, F11, F12, F13, F16, F17, F18,
      F20, F21, F22, and F23. Each was a specification gap that would let two
      correct implementations diverge, or a denominator that let failed rows
      flatter a result.
    outcome_triggered: false
    outcome_triggered_justification: >-
      No workflow row has executed and no outcome has been inspected. Every change
      follows from an independent pre-outcome review of the protocol text.
