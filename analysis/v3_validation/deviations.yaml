    protocol_section: workflow_matrix
    description: >-
      Added comparator workflow W9_virtus (VIRTUS3 at published defaults for 10x
      single-cell RNA-seq) across the two synthetic negative conditions and the
      three public positives, matching the dataset scope already used for Venus
      and Viral-Track. Row count rises from 52 to 57. Added a
      comparator_architecture_note recording why VIRTUS is retained alongside the
      traditional subtraction rows, and extended no_silent_algorithm_patch to name
      VIRTUS.
    reason: >-
      The frozen matrix omitted VIRTUS, a published and widely used viral
      detection pipeline that is architecturally distinct from the comparators
      already present. VIRTUS subtracts host reads with STAR and then quantifies
      viral transcripts with salmon in a splicing-aware manner rather than by
      genome copy number, so it exercises a failure surface that Venus and
      Viral-Track do not. Omitting it would have left a benchmark that could not
      distinguish a ViralScan-specific result from one shared by all
      read-detection comparators.
    outcome_triggered: false
    outcome_triggered_justification: >-
      No workflow row has been executed and no outcome has been inspected. The
      omission was found by reviewing comparator coverage against the published
      tool landscape, not by observing any result. The amendment_rule requirement
      to rerun affected rows is vacuous because none has run.
