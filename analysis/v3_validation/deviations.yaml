schema_version: "1.0.0"
protocol_id: viralscan-v3-validation
description: >-
  Protocol deviation and amendment ledger required by
  failure_and_deviation_reporting. Every change to a frozen section appends a
  record here. Records are append-only and are never edited or removed.

deviations:
  - deviation_id: DEV-000
    date: "2026-07-22"
    affected_workflow_row_ids: []
    protocol_section: harmonization
    description: >-
      Baseline record establishing the frozen harmonization digest so the
      amendment rule can be enforced. This record predates the ledger: the
      harmonization contract was frozen under SCI-02 before any deviation record
      existed, so it has no natural predecessor. before and after are identical
      by design, declaring a starting value rather than a change.
    reason: >-
      SCI-05 round 1 finding F7 found the amendment rule unenforceable because
      the validator never opened this ledger. Enforcing it requires a baseline
      for every already-frozen section; without one, a continuity check fails
      closed against harmonization even though nothing improper happened to it.
    outcome_triggered: false
    outcome_triggered_justification: >-
      No workflow row has executed and no outcome has been inspected. This is
      bookkeeping to make an existing freeze checkable, not a response to any
      measured result.
