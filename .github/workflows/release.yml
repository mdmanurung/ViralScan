name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ci-gate:
    name: Require successful CI for the exact tagged commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: Require reviewed immutable Action pins
        run: python scripts/check_actions_pinned.py
      - name: Resolve tagged commit and verify CI
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          python scripts/check_release_ci.py --sha "$sha" > release-ci.json
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-ci
          path: release-ci.json

  build:
    name: Build and test distributions once
    needs: ci-gate
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.channel.outputs.stable }}
      publish_environment: ${{ steps.channel.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.ci-gate.outputs.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: python -m pip install build twine pyyaml jsonschema  # jsonschema: check_ship_scope -> governance_utils
      - name: Verify release versions
        run: python scripts/check_versions.py --tag "${GITHUB_REF##*/}"
      - name: Select publication channel
        id: channel
        run: |
          version="${GITHUB_REF##*/}"
          if [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
            echo "environment=pypi" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "environment=testpypi" >> "$GITHUB_OUTPUT"
          fi
      - name: Build, inspect and checksum distributions
        run: |
          python -m build
          python -m twine check dist/*.whl dist/*.tar.gz
          python scripts/check_dist_size.py dist --max-mb 60
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          python scripts/check_ship_scope.py --wheel "${wheels[0]}" --sdist "${sdists[0]}" --docker-context .
          mkdir -p release-assets
          (cd dist && sha256sum *.whl *.tar.gz) > release-assets/SHA256SUMS
      - name: Clean wheel and sdist installs with declared dependencies
        run: |
          for artifact in "$GITHUB_WORKSPACE"/dist/*.whl "$GITHUB_WORKSPACE"/dist/*.tar.gz; do
            kind=wheel
            [[ "$artifact" == *.tar.gz ]] && kind=sdist
            env_dir="$RUNNER_TEMP/viralscan-$kind"
            python -m venv "$env_dir"
            "$env_dir/bin/python" -m pip install "$artifact"
            "$env_dir/bin/python" -m pip check
            "$env_dir/bin/viralscan" --version
            "$env_dir/bin/viralscan" --help
            (cd "$RUNNER_TEMP" && env -u PYTHONPATH "$env_dir/bin/python" "$GITHUB_WORKSPACE/scripts/release_package_smoke.py" "$RUNNER_TEMP/smoke-$kind")
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-checksums
          path: release-assets/SHA256SUMS

  container:
    name: Build, scan and publish the tested wheel in the locked runtime
    needs: [ci-gate, build]
    runs-on: ubuntu-latest
    # Configure required reviewers on pypi in repository settings before stable release.
    # Declaring an environment here does not configure those protection rules.
    environment: ${{ needs.build.outputs.publish_environment }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.ci-gate.outputs.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist-checksums
          path: release-assets/
      - name: Verify the tested artifacts
        run: (cd dist && sha256sum -c ../release-assets/SHA256SUMS)
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - name: Build candidate once without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          build-contexts: wheel=./dist
          load: true
          push: false
          tags: viralscan:release-test
          platforms: linux/amd64
      - name: Validate the installed image package
        run: |
          docker run --rm --entrypoint /opt/conda/envs/viralscan/bin/python \
            --mount "type=bind,src=$GITHUB_WORKSPACE/scripts/release_package_smoke.py,dst=/tmp/release_package_smoke.py,readonly" \
            viralscan:release-test /tmp/release_package_smoke.py /tmp/package-smoke
      - name: Full OCI runtime SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: viralscan:release-test
          format: spdx-json
          output-file: release-assets/oci.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Audit the product image before publication
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        with:
          sbom: release-assets/oci.sbom.spdx.json
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: release-assets/oci-vulnerabilities.json
      - name: Record installed Python licence metadata
        run: |
          docker run --rm --entrypoint /opt/conda/envs/viralscan/bin/python viralscan:release-test -c 'import importlib.metadata as m,json; print(json.dumps([{"name":d.metadata["Name"],"version":d.version,"license_expression":d.metadata.get("License-Expression"),"license":d.metadata.get("License")} for d in m.distributions()],sort_keys=True))' > release-assets/python-license-metadata.json
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tag from git tag
        id: meta
        run: |
          version="${GITHUB_REF##*/}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=ghcr.io/mdmanurung/viralscan:$version" >> "$GITHUB_OUTPUT"
          # Only a stable MAJOR.MINOR.PATCH tag may advance latest.
          if [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tags=ghcr.io/mdmanurung/viralscan:$version,ghcr.io/mdmanurung/viralscan:latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the scanned image and prepare digest-derived SIF definition
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          IFS=',' read -ra tags <<< "$IMAGE_TAGS"
          for tag in "${tags[@]}"; do
            docker tag viralscan:release-test "$tag"
            docker push "$tag"
          done
          oci="$(docker inspect --format '{{index .RepoDigests 0}}' "${tags[0]}")"
          printf '%s\n' "$oci" > release-assets/OCI_DIGEST
          python scripts/release_sif_definition.py "$oci" > release-assets/Singularity.release.def
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: container-release-assets
          path: release-assets/

  publish:
    name: Publish tested distributions
    needs: [ci-gate, build, container]
    runs-on: ubuntu-latest
    # Trusted Publishers and environment protection must be configured by maintainers.
    environment: ${{ needs.build.outputs.publish_environment }}
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist-checksums
          path: release-assets/
      - name: Verify the tested artifacts
        run: (cd dist && sha256sum -c ../release-assets/SHA256SUMS)
      - name: Publish stable to PyPI
        if: needs.build.outputs.stable == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
      - name: Publish candidate to TestPyPI
        if: needs.build.outputs.stable != 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  release-assets:
    name: Attach the tested artifacts and release receipts
    needs: [build, container, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: release-files/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-ci
          path: release-files/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: container-release-assets
          path: release-files/
      - name: Create versioned GitHub release with receipts
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE: ${{ needs.build.outputs.stable }}
        run: |
          args=()
          [[ "$STABLE" == true ]] || args+=(--prerelease)
          gh release create "${GITHUB_REF##*/}" release-files/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "${GITHUB_REF##*/}" --generate-notes "${args[@]}"
