name: Release

# Push a tag like ``v2.3.0`` to trigger a build and publish to PyPI.
# Requires a configured PyPI Trusted Publisher for this repository:
#   https://docs.pypi.org/trusted-publishers/
on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build sdist + wheel
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          python -m pip install build

      - name: Build distributions
        run: python -m build

      - name: Verify version matches tag
        run: |
          tag="${GITHUB_REF##*/}"
          # Strip leading "v" if present.
          tag_version="${tag#v}"
          # Version is single-sourced in src/viralscan/__init__.py (pyproject reads it
          # dynamically via [tool.setuptools.dynamic]).
          pkg_version=$(python -c "import re, pathlib; print(re.search(r'__version__ = \"([^\"]+)\"', pathlib.Path('src/viralscan/__init__.py').read_text()).group(1))")
          if [ "$tag_version" != "$pkg_version" ]; then
            echo "::error::Tag $tag does not match package version $pkg_version"
            exit 1
          fi

      - name: Install-test built wheel
        run: |
          python -m venv /tmp/viralscan-wheel-test
          /tmp/viralscan-wheel-test/bin/python -m pip install --upgrade pip
          /tmp/viralscan-wheel-test/bin/python -m pip install pyyaml pyfiglet
          /tmp/viralscan-wheel-test/bin/python -m pip install --no-deps dist/*.whl
          /tmp/viralscan-wheel-test/bin/viralscan --version
          /tmp/viralscan-wheel-test/bin/viralscan --help
          /tmp/viralscan-wheel-test/bin/viralscan data fetch --help
          test -f /tmp/viralscan-wheel-test/lib/python*/site-packages/viralscan/scripts/emptydrops.R

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: Publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/ViralScan
    permissions:
      # OIDC token for PyPI Trusted Publishing.
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/

      - uses: pypa/gh-action-pypi-publish@release/v1

  container:
    name: Build + push container (ghcr.io)
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tag from git tag
        id: meta
        run: echo "version=${GITHUB_REF##*/}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/mdmanurung/viralscan:latest
            ghcr.io/mdmanurung/viralscan:${{ steps.meta.outputs.version }}
