name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  ci-gate:
    name: Require successful CI for the exact tagged commit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: Require reviewed immutable Action pins
        run: python scripts/check_actions_pinned.py
      - name: Resolve tagged commit and verify CI
        id: commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          sha="$(git rev-parse HEAD)"
          python scripts/check_release_ci.py --sha "$sha" > release-ci.json
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-ci
          path: release-ci.json

  build:
    name: Build and test distributions once
    needs: ci-gate
    runs-on: ubuntu-latest
    outputs:
      stable: ${{ steps.channel.outputs.stable }}
      publish_environment: ${{ steps.channel.outputs.environment }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.ci-gate.outputs.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: Install build tooling
        run: python -m pip install build twine pyyaml jsonschema  # jsonschema: check_ship_scope -> governance_utils
      - name: Verify release versions
        run: python scripts/check_versions.py --tag "${GITHUB_REF##*/}"
      - name: Select publication channel
        id: channel
        run: |
          version="${GITHUB_REF##*/}"
          if [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "stable=true" >> "$GITHUB_OUTPUT"
            echo "environment=pypi" >> "$GITHUB_OUTPUT"
          else
            echo "stable=false" >> "$GITHUB_OUTPUT"
            echo "environment=testpypi" >> "$GITHUB_OUTPUT"
          fi
      - name: Build, inspect and checksum distributions
        run: |
          python -m build
          python -m twine check dist/*.whl dist/*.tar.gz
          python scripts/check_dist_size.py dist --max-mb 60
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          test "${#wheels[@]}" -eq 1
          test "${#sdists[@]}" -eq 1
          python scripts/check_ship_scope.py --wheel "${wheels[0]}" --sdist "${sdists[0]}" --docker-context .
          mkdir -p release-assets
          (cd dist && sha256sum *.whl *.tar.gz) > release-assets/SHA256SUMS
      - name: Clean wheel and sdist installs with declared dependencies
        run: |
          for artifact in "$GITHUB_WORKSPACE"/dist/*.whl "$GITHUB_WORKSPACE"/dist/*.tar.gz; do
            kind=wheel
            [[ "$artifact" == *.tar.gz ]] && kind=sdist
            env_dir="$RUNNER_TEMP/viralscan-$kind"
            python -m venv "$env_dir"
            "$env_dir/bin/python" -m pip install "$artifact"
            "$env_dir/bin/python" -m pip check
            "$env_dir/bin/viralscan" --version
            "$env_dir/bin/viralscan" --help
            (cd "$RUNNER_TEMP" && env -u PYTHONPATH "$env_dir/bin/python" "$GITHUB_WORKSPACE/scripts/release_package_smoke.py" "$RUNNER_TEMP/smoke-$kind")
          done
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: dist-checksums
          path: release-assets/SHA256SUMS

  container:
    name: Build, scan and publish the tested wheel in the locked runtime
    needs: [ci-gate, build]
    runs-on: ubuntu-latest
    # REL-14: `pypi` (stable tags) and `testpypi` (every other tag, e.g. 3.0.0b1 or 3.0.0rc1).
    # Required reviewers on `pypi` gate this job, so an unapproved stable tag pushes no image.
    # Declaring an environment here does not create it or its protection rules; the
    # maintainer steps are in PLAN.md REL-14 and MAINTAINER_CHECKLIST.md.
    environment: ${{ needs.build.outputs.publish_environment }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.ci-gate.outputs.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist-checksums
          path: release-assets/
      - name: Verify the tested artifacts
        run: (cd dist && sha256sum -c ../release-assets/SHA256SUMS)
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - name: Build candidate once without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          build-contexts: wheel=./dist
          load: true
          push: false
          tags: viralscan:release-test
          platforms: linux/amd64
      - name: Validate the installed image package
        run: |
          docker run --rm --entrypoint /opt/conda/envs/viralscan/bin/python \
            --mount "type=bind,src=$GITHUB_WORKSPACE/scripts/release_package_smoke.py,dst=/tmp/release_package_smoke.py,readonly" \
            viralscan:release-test /tmp/release_package_smoke.py /tmp/package-smoke
      - name: Full OCI runtime SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: viralscan:release-test
          format: spdx-json
          output-file: release-assets/oci.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Audit the product image before publication
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        with:
          sbom: release-assets/oci.sbom.spdx.json
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: release-assets/oci-vulnerabilities.json
      - name: List high and critical image findings
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          f = pathlib.Path("release-assets/oci-vulnerabilities.json")
          if f.is_file():
              for m in json.loads(f.read_text())["matches"]:
                  v, a = m["vulnerability"], m["artifact"]
                  if v["severity"] in ("High", "Critical"):
                      print(v["severity"], v["id"], a["name"], a["version"], a["type"], "fixed:", v.get("fix", {}).get("versions"), a["locations"][0]["path"] if a.get("locations") else "")
          PY
      - name: Keep the image findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: oci-vulnerabilities
          path: release-assets/oci-vulnerabilities.json
          if-no-files-found: ignore
      - name: Audit the locked product environment against OSV and ship the locks (REL-11)
        # Advisory: conda matches are by package name (OSV has no conda ecosystem), so this
        # never gates; reviewed exceptions are in security/reviewed_exceptions.yaml.
        continue-on-error: true
        run: |
          cp uv.lock environment.explicit.txt environment.full.explicit.txt security/reviewed_exceptions.yaml release-assets/
          python scripts/audit_locks.py --conda-lock environment.explicit.txt 2>&1 | tee release-assets/lock-audit.txt
      - name: Record installed Python licence metadata
        run: |
          docker run --rm --entrypoint /opt/conda/envs/viralscan/bin/python viralscan:release-test -c 'import importlib.metadata as m,json; print(json.dumps([{"name":d.metadata["Name"],"version":d.version,"license_expression":d.metadata.get("License-Expression"),"license":d.metadata.get("License")} for d in m.distributions()],sort_keys=True))' > release-assets/python-license-metadata.json
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Image tag from git tag
        id: meta
        run: |
          version="${GITHUB_REF##*/}"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tags=ghcr.io/mdmanurung/viralscan:$version" >> "$GITHUB_OUTPUT"
          # Only a stable MAJOR.MINOR.PATCH tag may advance latest.
          if [[ "$version" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tags=ghcr.io/mdmanurung/viralscan:$version,ghcr.io/mdmanurung/viralscan:latest" >> "$GITHUB_OUTPUT"
          fi
      - name: Publish the scanned image and prepare digest-derived SIF definition
        env:
          IMAGE_TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          IFS=',' read -ra tags <<< "$IMAGE_TAGS"
          for tag in "${tags[@]}"; do
            docker tag viralscan:release-test "$tag"
            docker push "$tag"
          done
          oci="$(docker inspect --format '{{index .RepoDigests 0}}' "${tags[0]}")"
          printf '%s\n' "$oci" > release-assets/OCI_DIGEST
          python scripts/release_sif_definition.py "$oci" > release-assets/Singularity.release.def
      - name: Record the tool manifest from inside the published image (REL-07)
        run: |
          oci="$(cat release-assets/OCI_DIGEST)"
          python scripts/release_parity.py versions \
            --runner "docker run --rm -e HOME=/tmp --entrypoint env $oci PATH=/opt/conda/envs/viralscan/bin:/usr/bin:/bin" \
            --digest "$oci" --output release-assets/tool-manifest.json
          cat release-assets/tool-manifest.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: container-release-assets
          path: release-assets/

  sif:
    name: Build the Apptainer image from the published OCI digest
    needs: [ci-gate, container]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: container-release-assets
          path: release-assets/
      - uses: eWaterCycle/setup-apptainer@95b5c781df5f72fd2271cc3cff06904a09d2a087  # v3.0.0
        with:
          apptainer-version: "1.5.4"
      - name: Build the SIF from the digest-derived definition (no second solve) and record its SHA-256
        env:
          APPTAINER_DOCKER_USERNAME: ${{ github.actor }}
          APPTAINER_DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
        run: |
          grep -qx "From: $(cat release-assets/OCI_DIGEST)" release-assets/Singularity.release.def
          apptainer build viralscan.sif release-assets/Singularity.release.def
          apptainer test viralscan.sif
          mkdir -p sif-assets
          sha256sum viralscan.sif > sif-assets/viralscan.sif.sha256
          cat sif-assets/viralscan.sif.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sif-assets
          path: sif-assets/
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: sif
          path: viralscan.sif
          retention-days: 7

  parity:
    name: Run the tiny workflow in locked conda, the image digest and the SIF (REL-09, REL-10)
    needs: [ci-gate, build, container, sif]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      APPTAINER_DOCKER_USERNAME: ${{ github.actor }}
      APPTAINER_DOCKER_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.ci-gate.outputs.sha }}
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: container-release-assets
          path: release-assets/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sif
          path: sif/
      - uses: mamba-org/setup-micromamba@4b9113af4fba0e9e1124b252dd6497a419e7396d  # v1.11.0
      - uses: eWaterCycle/setup-apptainer@95b5c781df5f72fd2271cc3cff06904a09d2a087  # v3.0.0
        with:
          apptainer-version: "1.5.4"
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9  # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create the locked conda environment and install the tested wheel
        shell: bash -el {0}
        run: |
          micromamba create --yes --name viralscan-locked --file environment.explicit.txt
          micromamba run -n viralscan-locked python -m pip install --no-deps dist/*.whl
      - name: Run the identical workflow in each environment and compare
        shell: bash -el {0}
        run: |
          oci="$(cat release-assets/OCI_DIGEST)"
          mkdir -p analysis/release_parity
          python scripts/release_parity.py run --name conda --kind conda \
            --runner "micromamba run -n viralscan-locked" \
            --digest "sha256:$(sha256sum environment.explicit.txt | cut -d' ' -f1)" \
            --work "$PWD/parity-work/conda" --out analysis/release_parity
          python scripts/release_parity.py run --name docker --kind docker \
            --runner "docker run --rm --user $(id -u):$(id -g) -e HOME=/tmp -e MPLCONFIGDIR=/tmp -e NUMBA_CACHE_DIR=/tmp -v $PWD:$PWD -w $PWD --entrypoint env $oci PATH=/opt/conda/envs/viralscan/bin:/usr/bin:/bin" \
            --digest "$oci" --work "$PWD/parity-work/docker" --out analysis/release_parity
          python scripts/release_parity.py run --name apptainer --kind apptainer \
            --runner "apptainer exec --cleanenv --bind $PWD sif/viralscan.sif" \
            --digest "sha256:$(sha256sum sif/viralscan.sif | cut -d' ' -f1)" \
            --work "$PWD/parity-work/apptainer" --out analysis/release_parity
          python scripts/release_parity.py compare \
            analysis/release_parity/result_conda.json \
            analysis/release_parity/result_docker.json \
            analysis/release_parity/result_apptainer.json \
            --output analysis/release_parity/parity_report.json
      - name: Keep the parity results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: release-parity
          path: analysis/release_parity/
          if-no-files-found: ignore

  publish:
    name: Publish tested distributions
    needs: [ci-gate, build, container, sif, parity]
    runs-on: ubuntu-latest
    # Trusted Publishers and environment protection must be configured by maintainers.
    environment: ${{ needs.build.outputs.publish_environment }}
    permissions:
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: dist/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist-checksums
          path: release-assets/
      - name: Verify the tested artifacts
        run: (cd dist && sha256sum -c ../release-assets/SHA256SUMS)
      - name: Attest wheel, sdist and checksums (REL-12)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-path: |
            dist/*.whl
            dist/*.tar.gz
            release-assets/SHA256SUMS
      - name: Publish stable to PyPI
        if: needs.build.outputs.stable == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
      - name: Publish candidate to TestPyPI
        if: needs.build.outputs.stable != 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33  # v1.14.2
        with:
          repository-url: https://test.pypi.org/legacy/

  release-assets:
    name: Attach the tested artifacts and release receipts
    needs: [build, container, sif, parity, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist
          path: release-files/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-ci
          path: release-files/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: dist-checksums
          path: release-files/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: container-release-assets
          path: release-files/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: sif-assets
          path: release-files/
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333  # v8.0.2
        with:
          name: release-parity
          path: release-files/
      - name: Create versioned GitHub release with receipts
        env:
          GH_TOKEN: ${{ github.token }}
          STABLE: ${{ needs.build.outputs.stable }}
        run: |
          args=()
          [[ "$STABLE" == true ]] || args+=(--prerelease)
          gh release create "${GITHUB_REF##*/}" release-files/* --repo "$GITHUB_REPOSITORY" --verify-tag --title "${GITHUB_REF##*/}" --generate-notes "${args[@]}"
