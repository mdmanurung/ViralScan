name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    env:
      # The governance scripts import `scripts.*` (repo root must be importable).
      PYTHONPATH: ${{ github.workspace }}
    steps:
      # Full history: the ledger append-only check compares against origin/main,
      # which a depth-1 checkout would not have, and the check fails closed when
      # the comparison revision is unreadable.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff mypy jsonschema numpy pandas scipy scikit-learn anndata scanpy matplotlib plotly jinja2 pyyaml "requests>=2.28"

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy
        run: mypy src/viralscan

      - name: Data-governance ship-scope check
        run: python scripts/check_data_governance.py

      - name: GitHub Actions are commit-pinned (REL-12)
        run: python scripts/check_actions_pinned.py

      - name: Version metadata agrees (REL-12)
        run: python scripts/check_versions.py

      # Draft gate only. Do NOT add --phase training here: the training gate is
      # supposed to fail while preregistration blockers are open, so asserting it
      # passes would keep CI permanently red, and asserting it fails would invert
      # into a false pass the moment those blockers legitimately close.
      - name: v3 protocol draft gate
        run: python scripts/validate_v3_protocol.py

      # The amendment ledger's hash chain is computed by whoever edits the file,
      # so it detects an inconsistent edit but not a coherent rewrite. This is
      # the external anchor: it compares against pushed history, which the
      # editing author does not solely control.
      #
      # On a push to main, origin/main IS the pushed head, so comparing against it
      # compares main with itself and passes vacuously (SCI-05 round 12, m1). Compare
      # the push against the head it replaced instead. A force-pushed `before` that
      # is no longer reachable makes the check fail closed, which is the intent.
      - name: deviation ledger is append-only
        env:
          LEDGER_BASE: ${{ github.event_name == 'push' && github.event.before || 'origin/main' }}
        run: python scripts/check_ledger_append_only.py --revision "$LEDGER_BASE"

  test:
    name: pytest (py${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-24.04, not ubuntu-latest: ubuntu-latest becomes Ubuntu 26.04 on
        # 2026-10-19. Python 3.9 (the reason for this pin) is no longer supported; move
        # back to ubuntu-latest once 3.10-3.12 on 26.04 are verified.
        os: [ubuntu-24.04, macos-latest]
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      # Full history: the ledger and governance tests resolve recorded git SHAs.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Install the scientific stack explicitly, then install ViralScan itself
      # with ``--no-deps``: this tests the *installed* package + console script
      # (the real user experience) while skipping snakemake's ``connection_pool``
      # transitive dep, which does not build cleanly with current setuptools
      # (see CLAUDE.md). The unit tests do not import snakemake at collection.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov responses jsonschema "setuptools>=77" numpy pandas scipy scikit-learn anndata scanpy matplotlib plotly jinja2 pyyaml "requests>=2.28"
          python -m pip install --no-deps -e .

      - name: Run unit tests
        run: pytest tests/ -v --cov=viralscan --cov-report=term-missing --cov-report=xml --cov-fail-under=60

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-24.04' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@b9fd7d16f6d7d1b5d2bec1a2887e65ceed900238  # v4.6.0
        with:
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false

      - name: CLI smoke test (installed console script)
        run: |
          viralscan --version
          viralscan --help
          viralscan data fetch --help
          viralscan build-ref --help
          viralscan evidence --help
          viralscan check-whitelist --help
          viralscan doctor --help
          viralscan validate-run --help

  snakemake9-dryrun:
    name: Snakemake 9 dry-run (DEF-08)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      # Same `snakemake -n` DAG tests as the local gate, on the major version
      # the pinned environment uses (environment.yml: snakemake 9.x).
      - name: Install snakemake 9 + stack
        run: |
          python -m pip install --upgrade pip
          python -m pip install "snakemake>=9,<10" pytest numpy pandas scipy scikit-learn anndata scanpy matplotlib plotly jinja2 pyyaml "requests>=2.28"
          python -m pip install --no-deps -e .
          snakemake --version
      - name: Snakefile dry-run DAG tests
        run: pytest tests/test_snakefile_dag.py -v

  notebooks:
    name: Vignettes (nbmake, CI-runnable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      # Execute the CI-runnable vignettes so docs cannot silently rot (the
      # enrichment vignette once broke against the live API under [skip-ci]).
      # The two heavy [skip-ci] notebooks (quickstart, building_a_reference)
      # build an index / run kb count and are intentionally excluded.
      - name: Install stack + nbmake
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest nbmake numpy pandas scipy scikit-learn anndata scanpy matplotlib plotly jinja2 pyyaml "requests>=2.28"
          python -m pip install --no-deps -e .
      - name: Execute CI-runnable vignettes
        env:
          MPLBACKEND: Agg
        run: |
          pytest --nbmake \
            docs/vignettes/multimapping_correction.ipynb \
            docs/vignettes/cell_calling_denominators.ipynb \
            docs/vignettes/cell_type_enrichment.ipynb \
            docs/vignettes/qc_and_read_evidence.ipynb \
            docs/vignettes/host_response_depth_control.ipynb \
            docs/vignettes/specificity_true_negative.ipynb

  security:
    name: Preliminary security scan (source + scanner environment)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
      - name: Install scanners
        run: python -m pip install --upgrade pip bandit pip-audit cyclonedx-bom
      - name: bandit (source)
        # Gate on high-severity only: the tool legitimately uses subprocess (list-form,
        # no shell=True) and urllib against trusted Ensembl/NCBI URLs, which bandit flags
        # as low/medium. Skip B101 (asserts document Snakefile-guaranteed invariants).
        run: bandit -r src/viralscan -x tests --skip B101 --severity-level high
      - name: pip-audit (scanner environment; preliminary)
        # This audits the packages installed in this job, not ViralScan's full
        # locked runtime. The release gate will audit the canonical lockfile.
        run: pip-audit --progress-spinner off
      - name: Generate preliminary scanner-environment SBOM
        run: cyclonedx-py environment --output-file sbom.cdx.json
      - name: Upload preliminary SBOM
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: viralscan-preliminary-scanner-environment-sbom
          path: sbom.cdx.json

  integration:
    name: Integration tests (real bioinformatics tools)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: mamba-org/setup-micromamba@4b9113af4fba0e9e1124b252dd6497a419e7396d  # v1.11.0
        with:
          environment-name: viralscan-it
          create-args: >-
            python=3.11 kb-python snakemake-minimal minimap2 samtools blast kraken2
            deeptools pygenometracks bedops
            pytest responses numpy pandas scipy scikit-learn anndata scanpy
            matplotlib plotly jinja2 pyyaml requests
          condarc: |
            channels:
              - conda-forge
              - bioconda
      - name: Install ViralScan package into integration environment
        run: python -m pip install --no-deps -e .

      - name: Run integration tests (offline subset)
        run: pytest -m "integration and not network" -v

  environment-file:
    name: Validate documented conda environment
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: mamba-org/setup-micromamba@4b9113af4fba0e9e1124b252dd6497a419e7396d  # v1.11.0
        with:
          environment-file: environment.yml
          condarc: |
            channels:
              - conda-forge
              - bioconda
      - name: Install package and smoke-test documented commands
        run: |
          python -m pip install --no-deps .
          viralscan --version
          viralscan --help
          # kb-python 0.30.x's `kb` CLI has no `--version`, and `kb --help` prints
          # its usage to stderr and exits non-zero (it wants a subcommand), which
          # aborts this step under `set -e`. A PATH presence check is the reliable
          # smoke test that the kb console script installed into the env.
          command -v kb
          snakemake --version
