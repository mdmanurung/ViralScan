name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff mypy numpy pandas scipy scikit-learn anndata scanpy matplotlib seaborn plotly jinja2 pyyaml "requests>=2.28" pyfiglet

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy
        run: mypy src/viralscan

  test:
    name: pytest (py${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Install the scientific stack explicitly, then install ViralScan itself
      # with ``--no-deps``: this tests the *installed* package + console script
      # (the real user experience) while skipping snakemake's ``connection_pool``
      # transitive dep, which does not build cleanly with current setuptools
      # (see CLAUDE.md). The unit tests do not import snakemake at collection.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov responses numpy pandas scipy scikit-learn anndata scanpy matplotlib seaborn plotly jinja2 pyyaml "requests>=2.28" pyfiglet
          python -m pip install --no-deps -e .

      - name: Run unit tests
        run: pytest tests/ -v --cov=viralscan --cov-report=term-missing --cov-report=xml --cov-fail-under=60

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false

      - name: CLI smoke test (installed console script)
        run: |
          viralscan --version
          viralscan --help
          viralscan data fetch --help
          viralscan build-ref --help
          viralscan evidence --help
          viralscan check-whitelist --help

  notebooks:
    name: Vignettes (nbmake, CI-runnable)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      # Execute the CI-runnable vignettes so docs cannot silently rot (the
      # enrichment vignette once broke against the live API under [skip-ci]).
      # The two heavy [skip-ci] notebooks (quickstart, building_a_reference)
      # build an index / run kb count and are intentionally excluded.
      - name: Install stack + nbmake
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest nbmake numpy pandas scipy scikit-learn anndata scanpy matplotlib seaborn plotly jinja2 pyyaml "requests>=2.28" pyfiglet
          python -m pip install --no-deps -e .
      - name: Execute CI-runnable vignettes
        env:
          MPLBACKEND: Agg
        run: |
          pytest --nbmake \
            docs/vignettes/multimapping_correction.ipynb \
            docs/vignettes/cell_calling_denominators.ipynb \
            docs/vignettes/cell_type_enrichment.ipynb \
            docs/vignettes/qc_and_read_evidence.ipynb \
            docs/vignettes/host_response_depth_control.ipynb \
            docs/vignettes/specificity_true_negative.ipynb

  security:
    name: Security scan (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install scanners
        run: python -m pip install --upgrade pip bandit pip-audit
      - name: bandit (source)
        # Gate on high-severity only: the tool legitimately uses subprocess (list-form,
        # no shell=True) and urllib against trusted Ensembl/NCBI URLs, which bandit flags
        # as low/medium. Skip B101 (asserts document Snakefile-guaranteed invariants).
        run: bandit -r src/viralscan -x tests --skip B101 --severity-level high
      - name: pip-audit (declared deps)
        # Audit the project's own dependency set; do not fail CI on advisories in the
        # heavy scientific stack we don't pin.
        run: pip-audit --progress-spinner off || true

  integration:
    name: Integration tests (real bioinformatics tools)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: viralscan-it
          create-args: >-
            python=3.11 kb-python snakemake-minimal minimap2 samtools blast
            pytest responses numpy pandas scipy scikit-learn anndata scanpy
            matplotlib seaborn plotly jinja2 pyyaml requests pyfiglet
          condarc: |
            channels:
              - conda-forge
              - bioconda
      - name: Install ViralScan package into integration environment
        run: python -m pip install --no-deps -e .

      - name: Run integration tests (offline subset)
        run: pytest -m "integration and not network" -v

  environment-file:
    name: Validate documented conda environment
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v1
        with:
          environment-file: environment.yml
          condarc: |
            channels:
              - conda-forge
              - bioconda
      - name: Install package and smoke-test documented commands
        run: |
          python -m pip install --no-deps .
          viralscan --version
          viralscan --help
          kb --version
          snakemake --version
