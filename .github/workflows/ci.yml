name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install lint tools
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff mypy numpy pandas scipy scikit-learn anndata scanpy matplotlib seaborn plotly jinja2 pyyaml "requests>=2.28" pyfiglet

      - name: ruff check
        run: ruff check .

      - name: ruff format --check
        run: ruff format --check .

      - name: mypy
        run: mypy src/viralscan

  test:
    name: pytest (py${{ matrix.python-version }} on ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Editable install of the project itself is intentionally avoided:
      # snakemake's ``connection_pool`` transitive dep does not build cleanly
      # with current setuptools (see CLAUDE.md). The unit tests import the
      # scientific stack directly, so install those packages explicitly.
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest pytest-cov responses numpy pandas scipy scikit-learn anndata scanpy matplotlib seaborn plotly jinja2 pyyaml "requests>=2.28" pyfiglet

      - name: Run unit tests
        env:
          PYTHONPATH: src
        run: pytest tests/ -v --cov=viralscan --cov-report=term-missing --cov-report=xml --cov-fail-under=60

      - name: Upload coverage to Codecov
        if: matrix.os == 'ubuntu-latest' && matrix.python-version == '3.11'
        uses: codecov/codecov-action@v4
        with:
          files: coverage.xml
          flags: unittests
          fail_ci_if_error: false

      - name: CLI smoke test (--help parses)
        env:
          PYTHONPATH: src
        run: python -m viralscan.menu --help

  security:
    name: Security scan (bandit + pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install scanners
        run: python -m pip install --upgrade pip bandit pip-audit
      - name: bandit (source)
        # Gate on high-severity only: the tool legitimately uses subprocess (list-form,
        # no shell=True) and urllib against trusted Ensembl/NCBI URLs, which bandit flags
        # as low/medium. Skip B101 (asserts document Snakefile-guaranteed invariants).
        run: bandit -r src/viralscan -x tests --skip B101 --severity-level high
      - name: pip-audit (declared deps)
        # Audit the project's own dependency set; do not fail CI on advisories in the
        # heavy scientific stack we don't pin.
        run: pip-audit --progress-spinner off || true

  integration:
    name: Integration tests (real bioinformatics tools)
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4
      - uses: mamba-org/setup-micromamba@v1
        with:
          environment-name: viralscan-it
          create-args: >-
            python=3.11 kb-python snakemake-minimal minimap2 samtools blast
            pytest responses numpy pandas scipy scikit-learn anndata scanpy
            matplotlib seaborn plotly jinja2 pyyaml requests pyfiglet
          condarc: |
            channels:
              - conda-forge
              - bioconda
      - name: Run integration tests (offline subset)
        env:
          PYTHONPATH: src
        run: pytest -m "integration and not network" -v
