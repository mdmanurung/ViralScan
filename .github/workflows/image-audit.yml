name: Image audit (no publish)

# Builds the product image from the committed lock and a fresh wheel, then runs the
# same grype gate as release.yml. No registry login, no push, no tag. Keep the build
# and scan steps in step with the `container` job of release.yml.
on:
  pull_request:
    paths:
      - Dockerfile
      - environment.explicit.txt
      - .dockerignore
      - .github/workflows/image-audit.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  image:
    name: Build and scan the product image
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
      - name: Build the wheel
        run: |
          python -m pip install build
          python -m build --wheel
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f  # v3.12.0
      - name: Build candidate without publishing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8  # v6.19.2
        with:
          context: .
          build-contexts: wheel=./dist
          load: true
          push: false
          tags: viralscan:release-test
          platforms: linux/amd64
      - name: Full OCI runtime SBOM
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
        with:
          image: viralscan:release-test
          format: spdx-json
          output-file: release-assets/oci.sbom.spdx.json
          upload-artifact: false
          upload-release-assets: false
      - name: Audit the product image
        uses: anchore/scan-action@27805bf3b4e84b4a5c980df22ed233c00390a439  # v7.4.2
        with:
          sbom: release-assets/oci.sbom.spdx.json
          fail-build: true
          severity-cutoff: high
          output-format: json
          output-file: release-assets/oci-vulnerabilities.json
      - name: List high and critical image findings
        if: always()
        run: |
          python - <<'PY'
          import json, pathlib
          f = pathlib.Path("release-assets/oci-vulnerabilities.json")
          if f.is_file():
              for m in json.loads(f.read_text())["matches"]:
                  v, a = m["vulnerability"], m["artifact"]
                  if v["severity"] in ("High", "Critical"):
                      print(v["severity"], v["id"], a["name"], a["version"], a["type"], "fixed:", v.get("fix", {}).get("versions"), a["locations"][0]["path"] if a.get("locations") else "")
          PY
      - name: Keep the image findings
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        with:
          name: oci-vulnerabilities
          path: |
            release-assets/oci-vulnerabilities.json
            release-assets/oci.sbom.spdx.json
          if-no-files-found: ignore
