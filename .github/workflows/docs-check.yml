# Strict docs checks on every pull request (PLAN DOC-01). No deploy here:
# docs.yml publishes, and GitHub Pages is a user-owned setting (DOCS-PAGES-01).
name: Docs check

on:
  pull_request:
    paths:
      - "docs/**"
      - "README.md"
      - "CHANGELOG.md"
      - "pyproject.toml"
      - ".github/workflows/docs-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sphinx:
    name: Sphinx html and linkcheck with -W
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install pandoc (nbsphinx) and the docs extra
        run: |
          sudo apt-get update && sudo apt-get install -y pandoc
          python -m pip install --upgrade pip
          python -m pip install ".[docs]"
      - name: Build HTML with warnings as errors
        run: sphinx-build -W --keep-going -E -a -b html docs docs/_build/html
      - name: Check links with warnings as errors
        run: sphinx-build -W --keep-going -b linkcheck docs docs/_build/linkcheck
