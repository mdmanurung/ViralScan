# Scheduled run of the two heavy vignettes that ci.yml skips (PLAN DOC-07).
# They build a kallisto index and run `kb count`, so they need the full conda
# environment. Logs and SHA-256 hashes are kept as a workflow artifact.
name: Heavy notebooks

on:
  schedule:
    - cron: "17 5 * * 0"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  heavy:
    name: Execute quickstart and building_a_reference
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: mamba-org/setup-micromamba@4b9113af4fba0e9e1124b252dd6497a419e7396d  # v1.11.0
        with:
          environment-file: environment.yml
          condarc: |
            channels:
              - conda-forge
              - bioconda
      - name: Install package and nbmake
        run: |
          python -m pip install pytest nbmake ipykernel
          python -m pip install --no-deps .
          viralscan doctor --profile full
      - name: Execute the two heavy notebooks
        env:
          MPLBACKEND: Agg
        run: |
          mkdir -p heavy_logs
          pytest --nbmake -v \
            docs/vignettes/quickstart_fastq_to_viral_load.ipynb \
            docs/vignettes/building_a_reference.ipynb \
            2>&1 | tee heavy_logs/nbmake.log
      - name: Record hashes
        if: always()
        run: |
          mkdir -p heavy_logs
          {
            git rev-parse HEAD
            pip freeze
          } > heavy_logs/environment.txt
          sha256sum docs/vignettes/*.ipynb environment.yml heavy_logs/* > heavy_logs/SHA256SUMS
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9  # v7.0.2
        if: always()
        with:
          name: heavy-notebook-logs
          path: heavy_logs/
