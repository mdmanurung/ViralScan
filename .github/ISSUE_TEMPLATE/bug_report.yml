name: Bug report
description: Report a reproducible ViralScan software or scientific-correctness defect
title: "[bug] "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not upload human-subject data, credentials, or institutional paths.
  - type: input
    id: version
    attributes:
      label: ViralScan version
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
    validations:
      required: true
  - type: textarea
    id: validation
    attributes:
      label: Doctor and validate-run output
    validations:
      required: true
