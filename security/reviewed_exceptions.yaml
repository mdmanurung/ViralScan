# Reviewed OSV exceptions for the lock audit (PLAN REL-11). Read by scripts/audit_locks.py.
#
# Every entry below is PENDING MAINTAINER REVIEW. A pending entry does not silence anything:
# the audit still counts its advisories and only labels them. An entry silences exactly the
# advisory ids it lists once its status is "reviewed" (and then needs reviewer, reviewed_on
# and review_by filled in). OSV has no conda ecosystem, so conda-lock matches are by package
# name only and can be false positives; the image scan (.grype.yaml, release.yml) is the
# authoritative one for the product image. Container-image exceptions live in .grype.yaml.
#
# To review an entry: read each advisory, check the affected range against the locked version,
# check whether the code path is reachable in ViralScan, then set status and reason.
